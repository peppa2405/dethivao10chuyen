<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trực Tuyến - Ghibli Ponyo Ocean Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Bảng màu Ghibli x Ponyo (Biển xanh, San hô cam, Bọt biển trắng, Nắng vàng) */
            --primary: #1e88a8; /* Ocean teal */
            --primary-dark: #0d4f66; /* Deep sea blue */
            --primary-light: #d7f3fa; /* Sea foam */
            --accent: #ff7a5c; /* Ponyo coral/orange dress */
            --accent-dark: #e8562f;

            --sidebar-bg: rgba(217, 244, 250, 0.85); /* Bọt biển kính mờ */
            --sidebar-hover: #bfeaf5;

            /* Ghibli Ponyo gradient: bầu trời hoàng hôn chạm mặt biển */
            --bg-gradient: linear-gradient(160deg, #ffe3b3 0%, #ffc4a3 18%, #8ecfe0 45%, #4fa8c9 72%, #0d6a8f 100%);
            --card-bg: rgba(255, 255, 255, 0.85); /* Hiệu ứng Glassmorphism - bọt biển */

            --text-main: #0b3d55; /* Xanh biển đậm thay cho đen */
            --text-muted: #0d4f66;
            --border-color: #a9e2ef;

            --success: #2a9d8f;
            --success-bg: #d4f4ee;
            --error: #EF4444;
            --error-bg: #FEE2E2;
            --warning: #f5a623;

            --sidebar-width: 320px;
            --radius-md: 20px;
            --radius-lg: 30px;
            --shadow-soft: 0 10px 40px rgba(13, 79, 102, 0.18);
            --shadow-glow: 0 0 20px rgba(255, 122, 92, 0.4);
        }

        * { box-sizing: border-box; }

        body {
    		font-family: 'Quicksand', sans-serif;
    		background: 
        		linear-gradient(160deg, rgba(255,227,179,0.55) 0%, rgba(78,168,201,0.55) 60%, rgba(13,106,143,0.6) 100%),
        		url('https://wallpaperaccess.com/full/715958.jpg') center center / cover no-repeat fixed;
    		color: var(--text-main);
    		margin: 0;
    		display: flex;
    		height: 100vh;
    		overflow: hidden;
    		font-size: 16px;
    		line-height: 1.6;
    		position: relative;
		}

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============ TRANG TRÍ ĐẠI DƯƠNG (bọt biển & sóng) ============ */
        .ocean-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 70%);
            border-radius: 50%;
            box-shadow: inset 0 0 6px rgba(255,255,255,0.6);
            animation: bubbleRise linear infinite;
            opacity: 0.8;
        }
        @keyframes bubbleRise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) translateX(20px); opacity: 0; }
        }
        .wave-footer {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 90px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.55;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6ec6de; border-radius: 10px; border: 2px solid #fff; }
        ::-webkit-scrollbar-thumb:hover { background: #ff7a5c; }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 2px solid rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(13, 79, 102, 0.12);
            z-index: 10;
            position: relative;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 1.4em;
            margin: 0;
            background: linear-gradient(to right, #ff7a5c, #1e88a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header p {
            font-size: 0.9em;
            color: #0d4f66;
            margin: 8px 0 0 0;
            font-weight: 600;
        }

        .exam-list {
            list-style: none;
            padding: 0 15px;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .exam-item {
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            color: #0d4f66;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
        }
        
        .exam-item::before {
            content: '🐟';
            margin-right: 12px;
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .exam-item:hover {
            background: var(--sidebar-hover);
            border-color: #6ec6de;
            transform: translateX(5px);
        }
        
        .exam-item:hover::before {
            transform: rotate(20deg);
        }

        .exam-item.active {
            background: linear-gradient(135deg, #ff9a76 0%, #1e88a8 100%);
            color: #FFF;
            box-shadow: var(--shadow-glow);
            border-color: transparent;
        }
        
        .exam-item.active::before { content: '🌊'; }

        /* ================= MAIN CONTENT ================= */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 2;
        }

        .exam-container {
            max-width: 860px;
            margin: 0 auto;
            padding-bottom: 60px;
            animation: floatUp 0.6s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
        }

        .exam-title-wrapper {
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            border-top: 6px solid #ff9a76;
        }

        .exam-title {
            font-family: 'Baloo 2', sans-serif;
            color: var(--primary-dark);
            font-size: 2em;
            font-weight: 800;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(30, 136, 168, 0.15);
        }

        .section-title {
            font-family: 'Baloo 2', sans-serif;
            background: linear-gradient(to right, #d7f3fa, rgba(255,255,255,0));
            padding: 12px 25px;
            border-radius: 50px;
            border-left: 6px solid var(--primary);
            margin: 35px 0 20px 0;
            font-weight: 800;
            font-size: 1.2em;
            color: var(--primary-dark);
            display: inline-block;
        }

        .info-box {
            background: rgba(255, 248, 231, 0.9);
            border: 2px dashed #f5a623;
            padding: 18px 25px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            color: #b45309;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.1);
        }

        .passage-block {
            padding: 30px;
            margin-bottom: 25px;
            font-size: 1.05em;
            color: #4c1d95;
            line-height: 1.8;
        }

        .passage-block h3 {
            font-family: 'Baloo 2', sans-serif;
            color: var(--accent-dark);
            margin-top: 0;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 12px;
            font-size: 1.3em;
        }

        .question-block {
            margin-bottom: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .question-block:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
            border-color: #a9e2ef;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--primary-dark);
        }

        /* ================= FORM ELEMENTS ================= */
        .options { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        
        .custom-radio-label { 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 15px;
            transition: all 0.2s ease;
            background: rgba(215, 243, 250, 0.4);
        }
        
        .custom-radio-label:hover {
            background: var(--primary-light);
            border-color: #a9e2ef;
        }

        .custom-radio-label input[type="radio"] { display: none; }

        .radio-mark {
            width: 22px;
            height: 22px;
            border: 2px solid #6ec6de;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff;
            transition: all 0.2s ease;
        }

        .custom-radio-label input[type="radio"]:checked + .radio-mark { 
            border-color: var(--accent); 
            background: var(--accent);
            box-shadow: 0 0 10px rgba(255, 122, 92, 0.4);
        }
        
        .custom-radio-label input[type="radio"]:checked + .radio-mark::after {
            content: '🫧';
            font-size: 12px;
            color: white;
        }

        .custom-radio-label input[type="radio"]:checked ~ .option-text {
            color: var(--primary-dark);
            font-weight: 800;
        }

        .premium-input, .premium-select, .premium-textarea {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.05em;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border: 2px solid #d7f3fa;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        
        .premium-select { cursor: pointer; width: auto; min-width: 200px; }
        .premium-textarea { resize: vertical; min-height: 160px; line-height: 1.6; }

        .premium-input:focus, .premium-select:focus, .premium-textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(110, 198, 222, 0.35);
        }
        
        .premium-input::placeholder, .premium-textarea::placeholder {
            color: #4fa8c9;
            opacity: 0.7;
        }

        /* ================= SUBMIT & RESULTS ================= */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff9a76 0%, #ff7a5c 100%);
            color: white;
            border: none;
            border-radius: 50px; /* Nút bo tròn như viên kẹo */
            font-family: 'Baloo 2', sans-serif;
            font-size: 1.25em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 40px;
            box-shadow: 0 10px 20px rgba(255, 122, 92, 0.35);
        }

        .btn-submit:hover:not(:disabled) { 
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 25px rgba(255, 122, 92, 0.45);
        }
        
        .btn-submit:disabled { 
            background: #e2e8f0; 
            cursor: not-allowed; 
            box-shadow: none;
            color: #94a3b8;
        }

        .result-panel {
            display: none;
            margin-top: 40px;
            padding: 35px;
            text-align: center;
            border: 3px solid #2a9d8f;
            background: rgba(255, 255, 255, 0.95);
        }

        .result-panel h2 {
            font-family: 'Baloo 2', sans-serif;
            color: #1e7d70;
            font-size: 2.2em;
            margin: 0 0 15px 0;
            text-shadow: 1px 1px 2px rgba(42, 157, 143, 0.2);
        }

        .explanation {
            margin-top: 20px;
            padding: 18px 20px;
            background: #fff2ec;
            border-radius: 12px;
            border-left: 5px solid var(--accent);
            display: none;
            font-size: 1em;
            color: #7a3319;
        }
        
        .explanation strong { color: var(--accent-dark); font-family: 'Baloo 2', sans-serif; }

        :root { --card-bg: rgba(255, 255, 255, 0.78); --radius-md: 14px; --radius-lg: 18px; --shadow-soft: 0 8px 22px rgba(13, 79, 102, 0.12); }
        .main-content { min-width: 0; min-height: 0; padding: 16px 20px 40px; }
        .exam-picker-bar {
            position: sticky; top: 0; z-index: 5; width: min(100%, 1100px); margin: 0 auto 18px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px 20px;
            background: rgba(255,255,255,.84); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 5px 18px rgba(13,79,102,.12);
        }
        .exam-picker-brand { min-width: 0; }
        .exam-picker-brand h2 { margin: 0; color: var(--primary-dark); font: 800 1.15em 'Baloo 2', sans-serif; }
        .exam-picker-brand p { margin: 0; color: var(--text-muted); font-size: .85em; font-weight: 600; }
        .exam-picker-control { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .exam-picker-control label { flex-shrink: 0; font-weight: 700; color: var(--primary-dark); }
        #exam-picker { width: min(52vw, 520px); min-width: 240px; }
        .exam-container { max-width: 1040px; }
        .exam-title-wrapper { padding: 20px; margin-bottom: 18px; }
        .exam-title { font-size: 1.8em; }
        .section-title {
            width: fit-content; max-width: 100%; padding: 8px 16px; border-radius: 10px;
            background: rgba(255,255,255,.82); backdrop-filter: blur(5px); font-size: 1.1em;
        }
        .passage-block {
            width: min(100%, 82ch); margin: 0 auto 20px; padding: 18px 20px; font-size: 1em;
            color: var(--text-main); line-height: 1.75; background: #fff; backdrop-filter: none;
            border: 1px solid var(--border-color); border-radius: 14px; box-shadow: none;
        }
        .question-block { margin-bottom: 16px; padding: 20px; background: var(--card-bg); }
        .info-box { padding: 15px 18px; background: rgba(255,255,255,.9); }
        .result-panel { margin-top: 24px; padding: 24px; border-radius: 14px; }
        @media (max-width: 700px) {
            .main-content { padding: 10px 12px 30px; }
            .exam-picker-bar { align-items: stretch; flex-direction: column; padding: 12px; }
            .exam-picker-control { align-items: stretch; flex-direction: column; gap: 5px; }
            #exam-picker { width: 100%; min-width: 0; max-width: none; }
            .exam-title-wrapper { padding: 16px; margin-bottom: 18px; }
            .exam-title { font-size: 1.5em; }
            .section-title { margin: 24px 0 14px; padding: 8px 12px; font-size: 1.05em; }
            .question-block { padding: 15px; }
            .passage-block { padding: 15px; font-size: .98em; }
            .custom-radio-label { padding: 10px 12px; }
            .premium-input, .premium-select, .premium-textarea { padding: 12px 14px; font-size: 1em; }
            .premium-select { width: 100%; min-width: 0; }
            .btn-submit { margin-top: 24px; padding: 14px; font-size: 1.05em; }
            .result-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- TRANG TRÍ ĐẠI DƯƠNG: bọt biển bay lên + sóng biển cuối trang -->
    <div class="ocean-decor" aria-hidden="true">
        <div class="bubble" style="left:6%;  width:14px; height:14px; animation-duration:14s; animation-delay:0s;"></div>
        <div class="bubble" style="left:16%; width:22px; height:22px; animation-duration:19s; animation-delay:2s;"></div>
        <div class="bubble" style="left:28%; width:10px; height:10px; animation-duration:11s; animation-delay:1s;"></div>
        <div class="bubble" style="left:40%; width:18px; height:18px; animation-duration:16s; animation-delay:4s;"></div>
        <div class="bubble" style="left:55%; width:12px; height:12px; animation-duration:13s; animation-delay:3s;"></div>
        <div class="bubble" style="left:68%; width:24px; height:24px; animation-duration:21s; animation-delay:1.5s;"></div>
        <div class="bubble" style="left:80%; width:16px; height:16px; animation-duration:17s; animation-delay:5s;"></div>
        <div class="bubble" style="left:92%; width:11px; height:11px; animation-duration:12s; animation-delay:2.5s;"></div>
        <svg class="wave-footer" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,40 C240,90 480,0 720,40 C960,80 1200,10 1440,50 L1440,100 L0,100 Z" fill="#0d6a8f"></path>
            <path d="M0,60 C240,100 480,30 720,65 C960,95 1200,40 1440,70 L1440,100 L0,100 Z" fill="#1e88a8" opacity="0.7"></path>
        </svg>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="exam-picker-bar">
            <div class="exam-picker-brand">
                <h2>Đề thi thử vào 10 chuyên</h2>
                <p>Tuyển tập đề thi các tỉnh thành</p>
            </div>
            <div class="exam-picker-control">
                <label for="exam-picker">Chọn đề thi</label>
                <select id="exam-picker" class="premium-select" aria-label="Chọn đề thi"></select>
            </div>
        </header>
        <div class="exam-container">
            <div class="glass-panel exam-title-wrapper">
                <h1 class="exam-title" id="display-exam-title">Vui lòng chọn đề thi</h1>
            </div>
            
            <form id="quiz-form" action="https://formspree.io/f/MÃ_CỦA_BẠN" method="POST">
    <!-- Thêm các ô ẩn để chứa điểm số và bài luận gửi về email -->
    <input type="hidden" name="exam_title" id="hidden_exam_title">
    <input type="hidden" name="score" id="hidden_score">
    <input type="hidden" name="essay" id="hidden_essay">

                <!-- THÔNG TIN HỌC SINH -->

                <div class="glass-panel question-block" style="border-left: 6px solid #ff7a5c; background: rgba(235, 249, 252, 0.9);">
                    <div class="question-text" style="color: var(--primary-dark); font-size: 1.2em;">🌷 Thông tin học sinh (Bắt buộc)</div>
                    <input type="text" id="student_name" class="premium-input" placeholder="Họ và tên của cậu là..." style="margin-bottom: 15px;" required>
                    <input type="email" id="student_email" class="premium-input" placeholder="Địa chỉ Email..." required>
                </div>

                <div id="questions-container"></div>
                <button type="button" class="btn-submit" id="submit-btn" style="display:none;" onclick="submitQuiz()">Nộp bài & Chấm điểm 🐚</button>
            </form>

            <div class="glass-panel result-panel" id="result-container">
                <h2>Kết Quả: <span id="score-text"></span> 🎉</h2>
                <p id="result-message" style="font-weight: 600; font-size: 1.1em; color: #4c1d95;">Điểm số và bài làm được lưu trên trình duyệt này để cậu xem lại.</p>
            </div>
        </div>
    </div>

<script>
    // Cơ sở dữ liệu đề thi
    const examDatabase = [
        {
            id: "exam_khanhhoa",
            title: "Đề Chuyên Anh Khánh Hoà 2026",
            data: [
                { type: "title", text: "I. LEXICO-GRAMMAR (30 points) - Part 1" },
                { type: "mcq", id: 1, question: "1. The social media post became extremely popular and turned into ______ within a few hours.", options: { A: "algorithm", B: "viral content", C: "press release", D: "editorial" }, correctAnswer: "B", explanation: "Đáp án B. 'viral content' (nội dung lan truyền). Cụm từ mô tả sự phổ biến bùng nổ trên mạng xã hội." },
                { type: "mcq", id: 2, question: "2. After spending hours scrolling through low-quality videos, he felt like he was experiencing serious ______.", options: { A: "brain rot", B: "cybersecurity", C: "digital transformation", D: "digital footprint" }, correctAnswer: "A", explanation: "Đáp án A. 'brain rot' (sự mụ mẫm đầu óc). Phù hợp với ngữ cảnh xem video chất lượng kém trong nhiều giờ." },
                { type: "mcq", id: 3, question: "3. He made a ______ decision without considering the potential long-term risks involved.", options: { A: "short-sight", B: "sight-short", C: "short-sighting", D: "short-sighted" }, correctAnswer: "D", explanation: "Đáp án D. 'short-sighted' (tầm nhìn hạn hẹp/thiển cận)." },
                { type: "mcq", id: 4, question: "4. After hearing the news, she felt completely ______ and unable to speak.", options: { A: "heart-breaking", B: "heart-broken", C: "broken-heart", D: "heart-break" }, correctAnswer: "B", explanation: "Đáp án B. 'heart-broken' (đau lòng). Dùng phân từ hai (V-ed) để miêu tả cảm xúc của con người." },
                { type: "mcq", id: 5, question: "5. The professor encouraged a ______ approach to solving real-world problems in class discussions.", options: { A: "problem-solving", B: "problem solved", C: "solving-problem", D: "solved-problem" }, correctAnswer: "A", explanation: "Đáp án A. 'problem-solving' (mang tính giải quyết vấn đề). Đóng vai trò làm tính từ bổ nghĩa cho danh từ 'approach'." },
                { type: "mcq", id: 6, question: "6. The app is designed to be ______, even for users with limited technical skills.", options: { A: "users friendly", B: "using-friendly", C: "friendly-users", D: "user-friendly" }, correctAnswer: "D", explanation: "Đáp án D. 'user-friendly' (thân thiện với người dùng). Cụm tính từ ghép quen thuộc trong công nghệ." },
                { type: "mcq", id: 7, question: "7. The company invested heavily in ______ equipment to stay competitive in the global market.", options: { A: "state-of-the-art", B: "states of the art", C: "the-state-of-art", D: "state-of-the-arts" }, correctAnswer: "A", explanation: "Đáp án A. 'state-of-the-art' (hiện đại nhất, tân tiến nhất)." },
                { type: "mcq", id: 8, question: "8. The event was canceled ______ unexpected weather conditions that made it unsafe for participants.", options: { A: "in contrast with", B: "in addition to", C: "on account of", D: "as opposed to" }, correctAnswer: "C", explanation: "Đáp án C. 'on account of' = because of (bởi vì)." },
                { type: "mcq", id: 9, question: "9. The policy was introduced ______ reducing traffic congestion in urban areas.", options: { A: "with a view to", B: "in lieu of", C: "in contrast with", D: "in exchange for" }, correctAnswer: "A", explanation: "Đáp án A. 'with a view to + V-ing' (với mục đích làm gì)." },
                { type: "mcq", id: 10, question: "10. The problem was solved ______ a simple adjustment to the system settings, rather than a complete overhaul.", options: { A: "by means of", B: "on no account", C: "in case of", D: "regardless of" }, correctAnswer: "A", explanation: "Đáp án A. 'by means of' (bằng phương pháp/cách thức nào đó)." },
                { type: "mcq", id: 11, question: "11. ______ unforgettable journey we had while exploring the ancient town during our summer vacation together!", options: { A: "How an", B: "What", C: "What an", D: "How" }, correctAnswer: "C", explanation: "Đáp án C. Cấu trúc câu cảm thán: 'What + a/an + adj + N đếm được số ít!'. Do 'unforgettable' bắt đầu bằng nguyên âm nên dùng 'an'." },
                { type: "mcq", id: 12, question: "12. She studied every chapter carefully and reviewed her notes twice; ______, she passed the final exam with excellent results.", options: { A: "unfortunately", B: "simultaneously", C: "consequently", D: "similarly" }, correctAnswer: "C", explanation: "Đáp án C. 'consequently' (kết quả là, do đó). Phù hợp về mặt logic nguyên nhân - kết quả." },
                { type: "mcq", id: 13, question: "13. The speech was inspiring and easy to understand; ______, it encouraged many students to volunteer for community projects.", options: { A: "in turn", B: "in case", C: "in contrast", D: "in brief" }, correctAnswer: "A", explanation: "Đáp án A. 'in turn' (từ đó, dẫn tới kết quả tiếp theo)." },
                { type: "mcq", id: 14, question: "14. She would have missed the international flight yesterday ______ her brother reminding her about the passport.", options: { A: "but for", B: "or else", C: "even if", D: "because of" }, correctAnswer: "A", explanation: "Đáp án A. 'but for + N/V-ing' (nếu không có...). Cấu trúc câu điều kiện loại 3 ẩn ý." },
                { type: "mcq", id: 15, question: "15. The more carefully you prepare for the interview, ______ you will be.", options: { A: "as confident as", B: "as confidently as", C: "the more confidently", D: "the more confident" }, correctAnswer: "D", explanation: "Đáp án D. Cấu trúc so sánh kép: 'The + so sánh hơn + S + V, the + so sánh hơn + S + V'." },
                { type: "mcq", id: 16, question: "16. The athlete was reported ______ intensive training before winning the international championship last month.", options: { A: "to be completed", B: "to have completed", C: "completing", D: "having completed" }, correctAnswer: "B", explanation: "Đáp án B. Câu bị động đặc biệt với hành động xảy ra trước thời điểm tường thuật, ta dùng 'to have + VpII'." },
                { type: "mcq", id: 17, question: "17. ______ he needs most right now is enough confidence to start speaking English in public.", options: { A: "What", B: "That", C: "Whether", D: "Why" }, correctAnswer: "A", explanation: "Đáp án A. 'What' đóng vai trò làm chủ ngữ cho mệnh đề danh ngữ (Điều mà anh ấy cần nhất...)." },
                { type: "mcq", id: 18, question: "18. They adopted a ______ dog from the local animal rescue center last weekend.", options: { A: "little white lovely", B: "white lovely little", C: "lovely little white", D: "lovely white little" }, correctAnswer: "C", explanation: "Đáp án C. Trật tự tính từ: OSASCOMP. Opinion (lovely) -> Size (little) -> Color (white)." },
                { type: "mcq", id: 19, question: "19. Nobody in the class has submitted the final assignment yet, ______?", options: { A: "have they", B: "hasn't he", C: "did they", D: "has nobody" }, correctAnswer: "A", explanation: "Đáp án A. Đại từ thay thế cho 'Nobody' trong câu hỏi đuôi là 'they'. 'Nobody' mang nghĩa phủ định nên phần đuôi ở dạng khẳng định." },
                { type: "mcq", id: 20, question: "20. Neither the manager nor the employees ______ aware of the issue.", options: { A: "was", B: "were", C: "is", D: "be" }, correctAnswer: "B", explanation: "Đáp án B. Cấu trúc 'Neither N1 nor N2' thì động từ chia theo N2 (the employees - số nhiều)." },
                
                { type: "title", text: "Part 2 - Word Formation (Điền từ)" },
                { type: "fill", id: 21, question: "21. Phở drifts into the morning like a soft memory, and its arrival is almost ______ (NOTICE), yet deeply felt.", correctAnswer: "unnoticed", explanation: "Từ cần điền là 'unnoticed' (tính từ). Dấu hiệu: 'yet' chỉ sự tương phản với 'deeply felt', tức là sự xuất hiện diễn ra mà không ai để ý tới." },
                { type: "fill", id: 22, question: "22. The rising steam forms an intriguing ______ (MIX) of scent and silence...", correctAnswer: "mixture", explanation: "Đáp án: mixture. Cần một danh từ đứng sau tính từ 'intriguing'." },
                { type: "fill", id: 23, question: "23. ...where herbs and broth seem to ______ (BREATH) together.", correctAnswer: "breathe", explanation: "Đáp án: breathe. Cần một động từ nguyên thể đứng sau cấu trúc 'seem to'." },
                { type: "fill", id: 24, question: "24. There is an artful refinement in every detail, a slow ______ (DEVOTE) shaped by hands...", correctAnswer: "devotion", explanation: "Đáp án: devotion. Cần một danh từ đứng sau tính từ 'slow'." },
                { type: "fill", id: 25, question: "25. ...shaped by hands both ______ (KNOW) and patient.", correctAnswer: "knowing", explanation: "Đáp án: knowing. Cần một tính từ song hành với 'patient'." },
                { type: "fill", id: 26, question: "26. The flavors gather in subtle depth, not demanding attention, but inviting it softly and ______ (PERSIST).", correctAnswer: "persistently", explanation: "Đáp án: persistently. Cần một trạng từ bổ nghĩa cho động từ 'inviting' và song hành với trạng từ 'softly'." },
                { type: "fill", id: 27, question: "27. Each bowl feels charming, not in extravagance, but in its quiet ______ (HONEST).", correctAnswer: "honesty", explanation: "Đáp án: honesty. Cần một danh từ đứng sau tính từ sở hữu 'its' và tính từ 'quiet'." },
                { type: "fill", id: 28, question: "28. Beyond taste, there is something more elusive. A quiet ______ (WARM) settles...", correctAnswer: "warmth", explanation: "Đáp án: warmth. Cần một danh từ làm chủ ngữ." },
                { type: "fill", id: 29, question: "29. ...settles, almost ______ (CONSCIOUS), like a forgotten feeling returning.", correctAnswer: "unconsciously", explanation: "Đáp án: unconsciously. Cần một trạng từ để bổ nghĩa cho động từ 'settles'." },
                { type: "fill", id: 30, question: "30. The world outside may remain restless and ______ (CHANGE), but here, something stays still.", correctAnswer: "changing", explanation: "Đáp án: changing (hoặc changeable). Cần tính từ song hành với 'restless'." },

                { type: "fill", id: 31, question: "31. Line 2 (Lỗi: publishing) &rarr; Sửa thành:", correctAnswer: "published", explanation: "Đáp án: published. Đây là mệnh đề phân từ rút gọn mang nghĩa bị động (Cuốn sách ĐƯỢC xuất bản)." },
                { type: "fill", id: 32, question: "32. Line 3 (Lỗi: financial) &rarr; Sửa thành:", correctAnswer: "finances", explanation: "Đáp án: finances. Cấu trúc song hành yêu cầu các từ nối với nhau bằng 'and' phải cùng từ loại. Emotions và relationships là danh từ, do đó 'financial' phải đổi thành danh từ." },
                { type: "fill", id: 33, question: "33. Line 4 (Lỗi: them) &rarr; Sửa thành:", correctAnswer: "themselves", explanation: "Đáp án: themselves. Chủ ngữ và tân ngữ chỉ cùng một đối tượng, do đó phải dùng đại từ phản thân." },
                { type: "fill", id: 34, question: "34. Line 5 (Lỗi: pattern) &rarr; Sửa thành:", correctAnswer: "patterns", explanation: "Đáp án: patterns. Chỉ các khuôn mẫu hành vi nói chung (có đếm được) nên dùng ở dạng số nhiều." },
                { type: "fill", id: 35, question: "35. Line 6 (Lỗi: take) &rarr; Sửa thành:", correctAnswer: "taking", explanation: "Đáp án: taking. Song hành với V-ing 'making' ở vế trước do cùng chịu sự chi phối của giới từ 'with'." },
                { type: "fill", id: 36, question: "36. Line 7 (Lỗi: possess) &rarr; Sửa thành:", correctAnswer: "possesses", explanation: "Đáp án: possesses. Đại từ bất định 'everyone' luôn đi với động từ chia ở ngôi thứ 3 số ít." },
                { type: "fill", id: 37, question: "37. Line 8 (Lỗi: awake) &rarr; Sửa thành:", correctAnswer: "awakened", explanation: "Đáp án: awakened. Cấu trúc bị động của động từ khuyết thiếu: can be + V-p2." },
                { type: "fill", id: 38, question: "38. Line 9 (Lỗi: set) &rarr; Sửa thành:", correctAnswer: "setting", explanation: "Đáp án: setting. Động từ đứng sau giới từ 'of' phải chia ở dạng V-ing." },
                { type: "fill", id: 39, question: "39. Line 10 (Lỗi: motivations) &rarr; Sửa thành:", correctAnswer: "motivates", explanation: "Đáp án: motivates. Cấu trúc song hành 'not only... but also', phía trước là động từ thì sau cũng là động từ." },
                { type: "fill", id: 40, question: "40. Line 11 (Lỗi: other) &rarr; Sửa thành:", correctAnswer: "others", explanation: "Đáp án: others. Cần đại từ đóng vai trò làm tân ngữ chỉ 'những người khác'." },   
                
                { type: "title", text: "II. READING (40 points) - Part 1: Open Cloze Test" },
                { type: "passage", text: "<h3>Little Things, Deep Happiness</h3><p>People often believe happiness comes only (0) <b>with</b> success, distant journeys, or the moment long-cherished dreams finally come true. They wait <b>(41)</b> ______ the 'right moment', thinking life will only become meaningful then. Yet, true joy often hides in the smallest, quietest moments.</p><p>A simple dinner with family, the smell of rain after a hot day, or a gentle message from someone asking if we are alright can warm the heart beyond words. <b>(42)</b> ______ such moments are easy to overlook because they seem too ordinary. We spend <b>(43)</b> ______ much time looking ahead that we forget what is already here. It does not mean giving up ambition or forgetting our goals. <b>(44)</b> ______, it means learning to pause and treasure the present.</p><p>Sometimes, happiness is sitting beside someone you love in <b>(45)</b> ______, saying nothing, and still feeling understood. It is hearing your mother call your name or watching the sky turn orange at sunset. These moments remind us <b>(46)</b> ______ life is built not only on success, but also on affection, gratitude, and human connection. We become <b>(47)</b> ______ peaceful and less afraid of whatever tomorrow may bring.</p><p>Love appears not in expensive gifts <b>(48)</b> ______ in small daily kindnesses - a glass of water offered, a patient ear, or a warm and sincere smile. They often mean far <b>(49)</b> ______ than we realize. Joy is not something we search <b>(50)</b> ______. It is already around us, waiting softly to be seen.</p>" },
                { type: "fill", id: 41, question: "41. (Điền 1 từ vào chỗ trống số 41)", correctAnswer: "for", explanation: "Đáp án: for. Cấu trúc 'wait for something' (chờ đợi điều gì đó)." },
                { type: "fill", id: 42, question: "42. (Điền 1 từ vào chỗ trống số 42)", correctAnswer: "but", explanation: "Đáp án: but / yet / however. Cần một liên từ mang nghĩa tương phản." },
                { type: "fill", id: 43, question: "43. (Điền 1 từ vào chỗ trống số 43)", correctAnswer: "so", explanation: "Đáp án: so. Cấu trúc 'so + adj/adv + that + clause'." },
                { type: "fill", id: 44, question: "44. (Điền 1 từ vào chỗ trống số 44)", correctAnswer: "instead", explanation: "Đáp án: Instead / Rather. Đứng đầu câu, mang nghĩa 'Thay vào đó'." },
                { type: "fill", id: 45, question: "45. (Điền 1 từ vào chỗ trống số 45)", correctAnswer: "silence", explanation: "Đáp án: silence. Cụm từ 'in silence' (trong im lặng)." },
                { type: "fill", id: 46, question: "46. (Điền 1 từ vào chỗ trống số 46)", correctAnswer: "that", explanation: "Đáp án: that. Cấu trúc 'remind someone that + clause'." },
                { type: "fill", id: 47, question: "47. (Điền 1 từ vào chỗ trống số 47)", correctAnswer: "more", explanation: "Đáp án: more. Song hành với dạng so sánh hơn ở vế sau 'less afraid' -> 'more peaceful'." },
                { type: "fill", id: 48, question: "48. (Điền 1 từ vào chỗ trống số 48)", correctAnswer: "but", explanation: "Đáp án: but. Cấu trúc 'not... but...' (không phải... mà là...)." },
                { type: "fill", id: 49, question: "49. (Điền 1 từ vào chỗ trống số 49)", correctAnswer: "more", explanation: "Đáp án: more. Cấu trúc so sánh hơn với 'than', có 'far' đứng trước để nhấn mạnh." },
                { type: "fill", id: 50, question: "50. (Điền 1 từ vào chỗ trống số 50)", correctAnswer: "for", explanation: "Đáp án: for. Cụm động từ 'search for' (tìm kiếm)." },
                
                { type: "title", text: "Part 2: Guided Cloze Test - Read the passage and choose the best answer." },
                { type: "passage", text: "<h3>Omotenashi</h3><p>In Japan, the concept of omotenashi represents a (0) <b>deeply</b> rooted tradition of selfless service, where hosts anticipate guests' needs without expecting anything in return. During a traditional tea ceremony, the host may <b>(51)</b> ______ each movement with extreme precision, turning a simple drink into an art form. Guests are encouraged to <b>(52)</b> ______ the quiet atmosphere and notice subtle gestures. Silence is not awkward but <b>(53)</b> ______ valued as part of the experience.</p><p>This cultural practice is based on the idea that one should <b>(54)</b> ______ fully in the present moment, leaving distractions behind. Even the arrangement of utensils can have a significant <b>(55)</b> ______ on the emotional experience of the guest.</p><p>Tourists who are <b>(56)</b> ______ through such ceremonies often report feeling unexpectedly calm. They also become more <b>(57)</b> ______ of small details that are usually ignored in daily life. Compared with Western-style hospitality, omotenashi is less <b>(58)</b> ______ on verbal communication and more on thoughtful action.</p><p>This philosophy continues to influence modern society. It is now <b>(59)</b> ______ in many service training programs, and many international hotels <b>(60)</b> ______ elements of this approach.</p>" },
                { type: "mcq", id: 51, question: "51. Choose the correct answer for blank (51):", options: { A: "promote", B: "foster", C: "perform", D: "rehearse" }, correctAnswer: "C", explanation: "Đáp án C. perform (thực hiện). 'Perform each movement' nghĩa là thực hiện từng động tác một cách chuẩn xác." },
                { type: "mcq", id: 52, question: "52. Choose the correct answer for blank (52):", options: { A: "undermine", B: "appreciate", C: "flatter", D: "celebrate" }, correctAnswer: "B", explanation: "Đáp án B. appreciate (trân trọng, thưởng thức). Phù hợp với ngữ cảnh thưởng thức bầu không khí tĩnh lặng." },
                { type: "mcq", id: 53, question: "53. Choose the correct answer for blank (53):", options: { A: "fully", B: "utterly", C: "highly", D: "strongly" }, correctAnswer: "C", explanation: "Đáp án C. highly. Collocation 'highly valued' (được đánh giá cao, được trân trọng)." },
                { type: "mcq", id: 54, question: "54. Choose the correct answer for blank (54):", options: { A: "engage", B: "embody", C: "immerse", D: "attend" }, correctAnswer: "A", explanation: "Đáp án A. engage. Đi với giới từ 'in' (engage in: tham gia vào, hòa mình vào)." },
                { type: "mcq", id: 55, question: "55. Choose the correct answer for blank (55):", options: { A: "consequence", B: "improvement", C: "impact", D: "limitation" }, correctAnswer: "C", explanation: "Đáp án C. impact. Cấu trúc 'have an impact on something' (có tác động/ảnh hưởng đến điều gì)." },
                { type: "mcq", id: 56, question: "56. Choose the correct answer for blank (56):", options: { A: "diverted", B: "led", C: "carried", D: "attended" }, correctAnswer: "B", explanation: "Đáp án B. led. Dạng bị động 'are led' mang nghĩa được dẫn dắt, hướng dẫn qua các nghi lễ." },
                { type: "mcq", id: 57, question: "57. Choose the correct answer for blank (57):", options: { A: "aware", B: "apprehensive", C: "sensitive", D: "attentive" }, correctAnswer: "A", explanation: "Đáp án A. aware. Cấu trúc 'aware of' (nhận thức được, nhận ra)." },
                { type: "mcq", id: 58, question: "58. Choose the correct answer for blank (58):", options: { A: "focused", B: "reflected", C: "relied", D: "imposed" }, correctAnswer: "A", explanation: "Đáp án A. focused. Cấu trúc 'focused on' (tập trung vào)." },
                { type: "mcq", id: 59, question: "59. Choose the correct answer for blank (59):", options: { A: "redundant", B: "external", C: "integral", D: "minor" }, correctAnswer: "C", explanation: "Đáp án C. integral (thiết yếu, không thể thiếu). Triết lý này hiện là phần thiết yếu trong các chương trình đào tạo." },
                { type: "mcq", id: 60, question: "60. Choose the correct answer for blank (60):", options: { A: "reject", B: "adopt", C: "abandon", D: "resist" }, correctAnswer: "B", explanation: "Đáp án B. adopt (áp dụng, tiếp nhận)." },
                
                { type: "title", text: "Part 3: Read the passage 'Gratitude in a Restless World' and do the tasks." },
                { type: "passage", text: "<h3>Gratitude in a Restless World</h3><p><strong>[A]</strong> On a crowded train during the evening rush, most passengers are absorbed in their own private worlds - scrolling through phones, answering emails, or simply staring blankly ahead. It is easy, in such moments, to feel disconnected, as if life were a series of obligations rather than experiences to be valued. Yet, scattered among these ordinary scenes are quiet instances of gratitude: a commuter offering a seat to an elderly stranger, a brief smile exchanged between two tired workers, or a message of thanks sent at the end of a long day. These small gestures suggest that gratitude, though often overlooked, remains a powerful force in modern life. In fact, gratitude is commonly defined as the appreciation of what is valuable and meaningful to oneself. However, this definition barely captures its depth. It is not merely a polite response to kindness or a social convention reinforced by upbringing; rather, it is a way of seeing the world. Individuals who cultivate gratitude tend to notice not only grand achievements but also the subtle moments that give life texture - the warmth of sunlight on a cold morning, the comfort of familiar routines, or the presence of supportive relationships.</p><p><strong>[B]</strong> In recent years, psychologists have taken a growing interest in gratitude, seeking to understand its impact on human well-being. Studies suggest that people who regularly reflect on what they are thankful for report higher levels of happiness and lower levels of stress. This is partly because gratitude shifts attention away from what is lacking toward what is already present. In a culture that often emphasizes comparison and achievement, such a shift can be both refreshing and transformative. Moreover, the influence of gratitude extends beyond the individual. In social contexts, expressions of appreciation can strengthen relationships and foster trust. When people feel acknowledged, they are more likely to engage positively with others, creating a cycle of goodwill. For example, a simple thank-you in the workplace can increase motivation and cooperation, while in personal relationships, it can deepen emotional connections. In this sense, gratitude functions as a kind of social glue, binding individuals together in mutual respect.</p><p><strong>[C]</strong> Despite its many benefits, gratitude does not always come naturally. Modern life, with its constant demands and distractions, can make it difficult to pause and reflect. People often take positive aspects of their lives for granted, focusing instead on problems or unmet expectations. This tendency is sometimes referred to as the 'negativity bias,' a psychological phenomenon in which negative experiences have a greater impact on our thoughts and emotions than positive ones. Overcoming this bias requires conscious effort and practice. One widely recommended approach is the use of a gratitude journal. By writing down a few things each day that one is thankful for, individuals can gradually train their minds to recognize positive experiences more readily. Over time, this practice can reshape habitual patterns of thinking, making gratitude a more automatic response. Another method involves expressing appreciation directly to others, whether through spoken words, written notes, or simple acts of kindness.</p><p><strong>[D]</strong> Such expressions not only benefit the recipient but also reinforce the giver's own sense of gratitude. However, it is important to note that gratitude is not about ignoring difficulties or pretending that everything is perfect. Rather, it coexists with hardship, offering a way to find meaning even in challenging circumstances. For instance, someone facing adversity may still feel grateful for the support of friends or the lessons learned through struggle. In this way, gratitude does not eliminate suffering but can make it more bearable, providing a sense of perspective and resilience. Cultural differences also shape how gratitude is expressed and understood. In some societies, it is conveyed openly through words and gestures, while in others, it may be demonstrated more subtly through actions. Regardless of these variations, the underlying principle remains consistent: an acknowledgment of the value that others and the world contribute to one's life.</p><p><strong>[E]</strong> This universality suggests that gratitude is a fundamental aspect of human experience, transcending language and tradition. Ultimately, gratitude invites a shift in attention - from what is missing to what is present, from dissatisfaction to appreciation. It encourages individuals to engage more fully with their surroundings and to recognize the interconnectedness of human lives. In a world that often feels hurried and fragmented, such a perspective can offer a sense of grounding. As the train reaches its final stop and passengers disperse into the night, the brief encounters of the day fade into memory. Yet, the moments of gratitude - however small - linger quietly, shaping how individuals perceive their lives and their relationships. Though it may not solve every problem, gratitude has the potential to transform the ordinary into something meaningful, reminding us that even in the midst of routine, there is much to be thankful for.</p>" },
                { type: "info", text: "<strong>For questions 61-65, choose the most suitable heading for each paragraph (A-E) from the list of headings (i-vii) below.</strong><br><br><strong>List of headings:</strong><br>i. Gratitude as a source of resilience and a universal human experience<br>ii. Scientific evidence and the social effects of gratitude<br>iii. Everyday examples and the deeper meaning of gratitude<br>iv. Final reflections on gratitude in ordinary life<br>v. Why gratitude is difficult and how to practise it<br>vi. Gratitude in professional success<br>vii. Cultural differences in emotional expression" },
                { type: "dropdown", id: 61, question: "61. Paragraph A", options: ["i", "ii", "iii", "iv", "v", "vi", "vii"], correctAnswer: "iii", explanation: "Đoạn A đưa ra các ví dụ thường ngày (everyday examples) trên chuyến tàu và định nghĩa ý nghĩa sâu xa của lòng biết ơn." },
                { type: "dropdown", id: 62, question: "62. Paragraph B", options: ["i", "ii", "iii", "iv", "v", "vi", "vii"], correctAnswer: "ii", explanation: "Đoạn B nói về nghiên cứu khoa học (psychologists, studies) và tác động xã hội (social contexts) của lòng biết ơn." },
                { type: "dropdown", id: 63, question: "63. Paragraph C", options: ["i", "ii", "iii", "iv", "v", "vi", "vii"], correctAnswer: "v", explanation: "Đoạn C nói về tại sao khó khăn (negativity bias) và cách thực hành (gratitude journal)." },
                { type: "dropdown", id: 64, question: "64. Paragraph D", options: ["i", "ii", "iii", "iv", "v", "vi", "vii"], correctAnswer: "i", explanation: "Đoạn D nhắc đến khả năng phục hồi (resilience, hardship) và sự khác biệt văn hóa chứng tỏ tính phổ quát (universal)." },
                { type: "dropdown", id: 65, question: "65. Paragraph E", options: ["i", "ii", "iii", "iv", "v", "vi", "vii"], correctAnswer: "iv", explanation: "Đoạn E là những suy ngẫm cuối cùng (final reflections) trên chuyến tàu về đời sống thường ngày." },
                { type: "info", text: "<strong>The reading passage has five paragraphs, A-E. Which paragraph contains the following information?</strong>" },
                { type: "dropdown", id: 66, question: "66. A mention of a psychological habit that causes people to focus more on negative experiences:", options: ["A", "B", "C", "D", "E"], correctAnswer: "C", explanation: "Nằm ở đoạn C, tác giả nhắc đến 'negativity bias' - xu hướng tập trung vào điều tiêu cực." },
                { type: "dropdown", id: 67, question: "67. An example showing that appreciation at work can improve teamwork and motivation:", options: ["A", "B", "C", "D", "E"], correctAnswer: "B", explanation: "Nằm ở đoạn B, câu 'For example, a simple thank-you in the workplace can increase motivation and cooperation'." },
                { type: "info", text: "<strong>For questions 68-70, complete the summary, using ONE WORD from the list of words below:</strong><br><br><strong>Word list:</strong> trust / journal / comparison / culture / stress / routine / support / achievement" },
                { type: "dropdown", id: 68, question: "68. Researchers have found that gratitude improves well-being by lowering levels of ______", options: ["trust", "journal", "comparison", "culture", "stress", "routine", "support", "achievement"], correctAnswer: "stress", explanation: "Đoạn B có câu: 'report higher levels of happiness and lower levels of stress'." },
                { type: "dropdown", id: 69, question: "69. ...and helping people shift attention away from constant ______ with others.", options: ["trust", "journal", "comparison", "culture", "stress", "routine", "support", "achievement"], correctAnswer: "comparison", explanation: "Đoạn B có câu: 'In a culture that often emphasizes comparison...'" },
                { type: "dropdown", id: 70, question: "70. One effective method of developing gratitude is keeping a gratitude ______, where individuals regularly record positive experiences.", options: ["trust", "journal", "comparison", "culture", "stress", "routine", "support", "achievement"], correctAnswer: "journal", explanation: "Đoạn C khuyên dùng 'a gratitude journal' (nhật ký biết ơn)." },
                
                { type: "passage", text: "<h3>Matcha: A Convergence of Ritual, Chemistry, and Global Demand</h3><p>In contemporary consumer culture, matcha has been rebranded as both a superfood and a lifestyle symbol. Yet such modern interpretations obscure its complex historical trajectory and cultural specificity. Unlike conventional infusions, in which leaves are steeped and discarded, matcha entails the ingestion of the entire leaf in powdered form. This seemingly simple distinction has profound implications not only for its nutritional profile but also for its symbolic and economic value.</p><p>The origins of matcha are frequently misattributed exclusively to Japan; however, its conceptual precursor emerged during the Tang Dynasty in China, when tea was processed into compressed forms for storage and transport. It was during the Song Dynasty, though, that powdered tea preparation gained prominence. This practice was subsequently transmitted to Japan in the late 12th century by the Zen monk Eisai, who advocated its use in monastic settings. Eisai's writings emphasized not merely the physiological effects of tea, but also its capacity to cultivate mental discipline.</p><p>Central to matcha's appeal within Zen Buddhism was its unique biochemical composition. While caffeine is typically associated with heightened alertness, it often induces restlessness when consumed in isolation. Matcha, by contrast, contains L-theanine, an amino acid that modulates the stimulatory effects of caffeine. The result is a sustained state of attentiveness devoid of the abrupt fluctuations commonly referred to as 'crashes.' This synergy rendered matcha particularly suitable for extended meditative practices, during which both concentration and composure are essential.</p><p>Over subsequent centuries, matcha became codified within the Japanese tea ceremony, or chanoyu, a highly ritualized practice governed by aesthetic and philosophical principles. The ceremony is not merely a method of beverage preparation, but an embodied expression of values such as wabi-sabi (an appreciation of imperfection) and ichigo ichie (the uniqueness of each encounter). Participants are expected to engage with the process attentively, as even minor gestures are imbued with meaning. In this context, matcha transcends its material form to become a medium of cultural transmission.</p><p>From a nutritional standpoint, matcha has been widely promoted as a potent source of antioxidants, particularly catechins such as epigallocatechin gallate (EGCG). These compounds have been linked to a range of potential health benefits, including anti-inflammatory effects and cardiovascular support. Nevertheless, it is important to distinguish between preliminary findings and clinically substantiated outcomes. While some studies suggest metabolic enhancement, the extent of such effects remains contested within the scientific community.</p><p>The cultivation of matcha-grade tea leaves involves a series of deliberate interventions designed to alter the plant's chemical composition. Prior to harvest, tea bushes are shaded for several weeks, a process that increases chlorophyll production while simultaneously elevating amino acid levels. Following harvesting, the leaves undergo steaming to prevent oxidation, after which they are meticulously sorted. The removal of stems and veins yields tencha, the raw material that is solely ground into matcha using granite mills. This process is inherently inefficient, with high-quality production requiring significant time and expertise.</p><p>As global demand for matcha has surged, so too have concerns regarding commodification and authenticity. The term 'matcha' has been applied indiscriminately across a wide spectrum of products, many of which bear little resemblance to traditional forms. Culinary-grade matcha, for instance, is often characterized by a more bitter profile and diminished vibrancy in color, making it suitable for incorporation into recipes but less desirable for direct consumption. The proliferation of such products complicates consumer perceptions and risks diluting established standards.</p><p>Moreover, the expansion of matcha production raises questions about environmental sustainability and labor practices. Intensive cultivation methods may lead to soil degradation if not managed responsibly, while increased demand places pressure on small-scale farmers. In response, certain producers have adopted organic certification and equitable trade frameworks. However, these initiatives are not yet universal, and their long-term efficacy remains to be seen.</p><p>In essence, matcha occupies a unique intersection between tradition and modernity. Its evolution from a monastic aid to a global commodity illustrates the dynamic interplay between cultural preservation and commercial adaptation. Understanding matcha, therefore, requires not only an appreciation of its sensory qualities but also a critical awareness of the historical and socio-economic forces that continue to shape its trajectory.</p>" },
                { type: "mcq", id: 71, question: "71. What is implied about the development of matcha in China?", options: { A: "It was fully developed during the Tang Dynasty.", B: "It was abandoned before reaching Japan.", C: "It evolved through multiple stages before transmission.", D: "It was identical to modern matcha." }, correctAnswer: "C", explanation: "Đáp án C. Khởi nguyên từ thời nhà Đường, sau đó phát triển dạng bột ở thời nhà Tống trước khi truyền sang Nhật Bản -> Trải qua nhiều giai đoạn." },
                { type: "mcq", id: 72, question: "72. What is the primary purpose of shading tea bushes before harvesting matcha leaves?", options: { A: "To modify the plant's biochemical composition, enhancing amino acid levels", B: "To intensify bitterness for culinary applications", C: "To reduce production costs and speed up harvesting", D: "To prevent the leaves from growing beyond a certain size" }, correctAnswer: "A", explanation: "Đáp án A. Thông tin ở đoạn 6: 'shaded for several weeks, a process that increases chlorophyll production while simultaneously elevating amino acid levels'." },
                { type: "mcq", id: 73, question: "73. What best describes the author's overall attitude toward matcha in the passage?", options: { A: "Enthusiastic endorsement of its global commercialization", B: "Rejection of modern adaptations in favor of historical purity", C: "Balanced analysis combining appreciation with critical caution", D: "Neutral scientific reporting without cultural interpretation" }, correctAnswer: "C", explanation: "Đáp án C. Tác giả phân tích cân bằng: vừa đánh giá cao lịch sử, vừa cảnh báo về thương mại hóa (commodification)." },
                { type: "mcq", id: 74, question: "74. TRUE/FALSE/NOT GIVEN: Matcha differs from regular tea infusions because the whole tea leaf is consumed rather than steeped and discarded.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "TRUE", explanation: "Đáp án: TRUE. Thông tin đoạn 1: 'Unlike conventional infusions... matcha entails the ingestion of the entire leaf...'." },
                { type: "mcq", id: 75, question: "75. TRUE/FALSE/NOT GIVEN: Eisai believed that matcha should only be used for improving physical health, not for mental discipline.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "FALSE", explanation: "Đáp án: FALSE. Đoạn 2 nói ngược lại: 'Eisai's writings emphasized not merely the physiological effects... but also its capacity to cultivate mental discipline'." },
                { type: "mcq", id: 76, question: "76. TRUE/FALSE/NOT GIVEN: The widespread modern image of matcha as a health trend tends to simplify its deeper historical and cultural background.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "TRUE", explanation: "Đáp án: TRUE. Đoạn 1: 'modern interpretations obscure its complex historical trajectory and cultural specificity'." },
                { type: "mcq", id: 77, question: "77. TRUE/FALSE/NOT GIVEN: The Japanese tea ceremony requires participants to follow strict procedures, but personal interpretation of gestures is discouraged.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "NOT_GIVEN", explanation: "Đáp án: NOT GIVEN. Bài đọc không đề cập việc có cấm giải thích/diễn giải cá nhân hay không." },
                { type: "mcq", id: 78, question: "78. TRUE/FALSE/NOT GIVEN: Although some producers have introduced sustainable farming and fair trade practices, there is no clear evidence yet of their lasting success.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "TRUE", explanation: "Đáp án: TRUE. Đoạn 8: 'However, these initiatives are not yet universal, and their long-term efficacy remains to be seen'." },
                { type: "fill", id: 79, question: "79. Complete the sentence (ONE WORD): High-quality matcha is produced from leaves known as (79) ______", correctAnswer: "tencha", explanation: "Đáp án: tencha. Lấy từ thông tin đoạn 6." },
                { type: "fill", id: 80, question: "80. Complete the sentence (ONE WORD): However, increasing demand has led to concerns about (80) ______ and sustainability.", correctAnswer: "commodification", explanation: "Đáp án: commodification (hoặc authenticity). Lấy từ thông tin đoạn 7." },
                
                { type: "title", text: "III. WRITING (30 points) - Part 1: Complete the second sentence" },
                { type: "fill", id: 81, question: "81. Many young people probably feel isolated because they spend too much time online.\n→ It is ________________________________", correctAnswer: "likely that many young people feel isolated because they spend too much time online", explanation: "Đáp án gợi ý: likely/probable that many young people feel isolated because they spend too much time online." },
                { type: "fill", id: 82, question: "82. The corporation made a mistake by ignoring the warnings about air pollution.\n→ The corporation shouldn't ________________________________", correctAnswer: "have ignored the warnings about air pollution", explanation: "Đáp án: have ignored the warnings about air pollution." },
                { type: "fill", id: 83, question: "83. I will support any decision the community makes about protecting the local park.\n→ Whatever ________________________________", correctAnswer: "decision the community makes about protecting the local park, I will support it", explanation: "Đáp án: decision the community makes about protecting the local park, I will support it." },
                { type: "fill", id: 84, question: "84. They are determined to continue the charity campaign even if they receive little financial support.\n→ Regardless ________________________________", correctAnswer: "of receiving little financial support, they are determined to continue the charity campaign", explanation: "Đáp án: of receiving little financial support, they are determined to continue the charity campaign." },
                { type: "fill", id: 85, question: "85. You chose to speak honestly with your parents about your academic difficulties, which was a very responsible thing to do.\n→ You were ________________________________", correctAnswer: "very responsible to speak honestly with your parents about your academic difficulties", explanation: "Đáp án: very responsible to speak honestly with your parents about your academic difficulties." },
                { type: "title", text: "Part 2: Complete the second sentence using the word given (3-5 words)" },
                { type: "fill", id: 86, question: "86. People believe that social media has greatly changed the way teenagers communicate. (supposed)\n→ Social media ________________________________ changed the way teenagers communicate.", correctAnswer: "is supposed to have greatly", explanation: "Đáp án: is supposed to have greatly." },
                { type: "fill", id: 87, question: "87. I don't think you should complain so much about the new school regulations. (rather)\n→ I'd ________________________________ so much about the new school regulations.", correctAnswer: "rather you didn't complain", explanation: "Đáp án: rather you didn't complain." },
                { type: "fill", id: 88, question: "88. Several parents came to ask about the new education policy while you were away. (during)\n→ During ________________________________ to ask about the new education policy.", correctAnswer: "your absence several parents came", explanation: "Đáp án: your absence several parents came." },
                { type: "fill", id: 89, question: "89. I think she is the person responsible for organizing the charity event. (appears)\n→ She ________________________________ responsible for organizing the charity event.", correctAnswer: "appears to be the person", explanation: "Đáp án: appears to be the person." },
                { type: "fill", id: 90, question: "90. The school bought far more computers than were necessary for the language laboratory. (needn't)\n→ The school ________________________________ computers for the language laboratory.", correctAnswer: "needn't have bought so many", explanation: "Đáp án: needn't have bought so many." },
                { type: "title", text: "Part 3: Essay Writing" },
                { type: "info", text: "<strong>📝 Hướng dẫn:</strong> Viết một bài luận ngắn trình bày quan điểm của cậu theo yêu cầu đề bài. Bài viết sẽ được gửi thẳng về hòm thư của giáo viên nhé! 🐚" },
                { type: "essay", id: 91, question: "Write an essay (about 200-250 words) discussing the benefits and drawbacks of using social media among teenagers." }
            ]
