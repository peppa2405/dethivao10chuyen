                { type: "info", text: "<strong>Read the following passage and choose the best answer from A, B, C or D to indicate the correct word for each of the blanks.</strong>" },
                { type: "passage", text: `<h3>THE TRUE PRICE OF ORGANIC FARMING</h3>
<p>Organic farming is a system of agricultural production that doesn't make use of genetically modified seeds and that (31)______ artificial pesticides and fertilisers with organic ones. But why is there almost always a (32)______ difference between the cost of organically produced food and that of non-organic alternatives?</p>
<p>One reason organic produce is sold at considerably higher prices (which in some cases can be 100% higher) relates to labour costs, which are (33)______ greater for the organic farmer. A downside of not using chemicals is that food production is slower and crop failure more common. The organic farmer must therefore spend more time preparing the land and put a more (34)______ effort into tending to crops as well as controlling pests and weeds - sometimes by hand. What is more, as the (35)______ of livestock is prioritised in organic farming, feeding animals with better-quality food, as well as ensuring their living conditions are (36)______ keeps prices high. So, all things considered, organic food may actually be good value (37)______ money, which is probably why consumers are anything but discouraged from purchasing what they perceive to be much healthier, tastier food.</p>
<p>Since concerns over the effects of conventional farming on both human health and the environment first (38)______, the number of people opting to (39)______ out conventionally produced food from their diet has been on the rise. In fact, the demand for organic produce is now so high that the supply is unable to meet it, and with organic farming (40)______ no more than 5% of total agricultural production in the UK, this is unlikely to change any time soon.</p>` },
                { type: "mcq", id: 31, question: "31. Blank (31)", options: { A: "detects", B: "outlines", C: "substitutes", D: "imports" }, correctAnswer: "C", explanation: "Đáp án C. 'substitute A with B' = thay thế A bằng B." },
                { type: "mcq", id: 32, question: "32. Blank (32)", options: { A: "substantial", B: "deep", C: "lengthy", D: "gradual" }, correctAnswer: "A", explanation: "Đáp án A. 'a substantial difference' = sự chênh lệch đáng kể (collocation)." },
                { type: "mcq", id: 33, question: "33. Blank (33)", options: { A: "exclusively", B: "purely", C: "proficiently", D: "undoubtedly" }, correctAnswer: "D", explanation: "Đáp án D. 'undoubtedly greater' = chắc chắn cao hơn, phù hợp với ý giải thích lý do giá cao." },
                { type: "mcq", id: 34, question: "34. Blank (34)", options: { A: "acute", B: "varied", C: "intense", D: "constant" }, correctAnswer: "C", explanation: "Đáp án C. 'put an intense effort into' = bỏ nhiều công sức. Các từ khác không đi với 'effort' trong ngữ cảnh này." },
                { type: "mcq", id: 35, question: "35. Blank (35)", options: { A: "neglect", B: "consumption", C: "mastery", D: "well-being" }, correctAnswer: "D", explanation: "Đáp án D. 'the well-being of livestock' = sức khoẻ/phúc lợi của vật nuôi được ưu tiên." },
                { type: "mcq", id: 36, question: "36. Blank (36)", options: { A: "sustainable", B: "optimal", C: "irresistible", D: "wholesome" }, correctAnswer: "B", explanation: "Đáp án B. 'living conditions are optimal' = điều kiện sống tối ưu." },
                { type: "mcq", id: 37, question: "37. Blank (37)", options: { A: "for", B: "with", C: "through", D: "to" }, correctAnswer: "A", explanation: "Đáp án A. Cụm cố định: 'good value for money'." },
                { type: "mcq", id: 38, question: "38. Blank (38)", options: { A: "strayed", B: "wandered", C: "roamed", D: "surfaced" }, correctAnswer: "D", explanation: "Đáp án D. 'concerns first surfaced' = mối lo ngại bắt đầu xuất hiện." },
                { type: "mcq", id: 39, question: "39. Blank (39)", options: { A: "slice", B: "cut", C: "carve", D: "scratch" }, correctAnswer: "B", explanation: "Đáp án B. Phrasal verb 'cut out' = loại bỏ (khỏi chế độ ăn)." },
                { type: "mcq", id: 40, question: "40. Blank (40)", options: { A: "accounting for", B: "carrying on", C: "leaving of", D: "treating to" }, correctAnswer: "A", explanation: "Đáp án A. 'account for + tỉ lệ' = chiếm bao nhiêu phần trăm." },
 
                { type: "title", text: "Part 2 - Open Cloze" },
                { type: "info", text: "<strong>Read the text below and think of the word which best fits each space. Use only ONE WORD in each space.</strong>" },
                { type: "passage", text: `<p>When it comes to kids and cell phones, the age at (41)______ they receive their first one varies across different countries. In the United States, nearly half of children (42)______ 10 and 12 years old own a smartphone with a service plan. In (43)______, in Germany, children typically get their own mobile phone at a later age, often not until they (44)______ high school. Similarly, in other European countries, owning a mobile phone isn't as prevalent as (45)______ is in the US.</p>
<p>In South Korea, children tend to receive their first mobile phones around second or third grade, (46)______ several hours daily on these devices. Conversely, in places like Malawi and Ghana, the ownership of mobile phones among children remains comparatively (47)______.</p>
<p>Parents worldwide have contrasting opinions on this issue. Some see cell phones as a way to (48)______ in touch, while others remain vigilant about the potential risks they might bring. However, no specific age is considered ideal for a child to own a phone, according to the American Academy of Pediatrics. Instead, the focus is (49)______ monitoring usage and limiting use (50)______ bedtime, especially for younger children.</p>` },
                { type: "fill", id: 41, question: "41. Blank (41)", correctAnswer: "which", explanation: "Đáp án: which. 'the age at which...' – giới từ + đại từ quan hệ." },
                { type: "fill", id: 42, question: "42. Blank (42)", correctAnswer: "between", explanation: "Đáp án: between. 'between 10 and 12 years old' (khoảng từ 10 đến 12 tuổi)." },
                { type: "fill", id: 43, question: "43. Blank (43)", correctAnswer: "contrast", explanation: "Đáp án: contrast. 'In contrast, ...' = ngược lại (đối lập với Mỹ)." },
                { type: "fill", id: 44, question: "44. Blank (44)", correctAnswer: "reach", explanation: "Đáp án: reach (cũng chấp nhận 'enter'). 'not until they reach high school' = mãi đến khi lên cấp 3." },
                { type: "fill", id: 45, question: "45. Blank (45)", correctAnswer: "it", explanation: "Đáp án: it. Đại từ thay cho 'owning a mobile phone' trong so sánh 'as prevalent as it is in the US'." },
                { type: "fill", id: 46, question: "46. Blank (46)", correctAnswer: "spending", explanation: "Đáp án: spending. Rút gọn mệnh đề: ..., (and) spending several hours daily on these devices." },
                { type: "fill", id: 47, question: "47. Blank (47)", correctAnswer: "low", explanation: "Đáp án: low. 'Conversely' (ngược lại) → tỉ lệ sở hữu ở Malawi và Ghana còn thấp." },
                { type: "fill", id: 48, question: "48. Blank (48)", correctAnswer: "keep", explanation: "Đáp án: keep (cũng chấp nhận 'stay'). 'keep in touch' = giữ liên lạc." },
                { type: "fill", id: 49, question: "49. Blank (49)", correctAnswer: "on", explanation: "Đáp án: on. 'the focus is on + V-ing' = trọng tâm là..." },
                { type: "fill", id: 50, question: "50. Blank (50)", correctAnswer: "before", explanation: "Đáp án: before (cũng có thể 'around/near'). 'limiting use before bedtime' = hạn chế sử dụng trước giờ đi ngủ." },
 
                { type: "title", text: "Part 3 - Multiple Choice Reading" },
                { type: "info", text: "<strong>You are going to read an article about teenagers. For questions 51-57, choose the answer (A, B, C or D) which you think fits best according to the text.</strong>" },
                { type: "passage", text: `<h3>Teenage brains</h3>
<p><em>Journalist Martin Baines talks to neuroscientist Professor Sarah-Jayne Blakemore about the development of the brain during adolescence.</em></p>
<p>Until I read Inventing Ourselves by Professor Sarah-Jayne Blakemore, I’d always assumed that what we think of as teenage behaviour is largely an invention of contemporary western society. I hadn’t imagined, for example, that 15-year-olds in the Kalahari Desert also complain about having to get up early - but they do. It was for people like me – there are lots of us – that Blakemore wrote her book explaining the science of everything from why teenagers can’t get out of bed in the morning to why they sometimes appear to be irresponsible narcissists. ‘We demonise teenagers more than any other section of society,’ she told me. ‘And it’s not right. They’re going through an essential stage of their development. Most adults don’t realise this.’</p>
<p>This is arguably inevitable. Blakemore says that until 20 years ago, it was assumed that teenage behaviour was largely down to hormonal changes in puberty and that children’s brains were more or less fully developed. The findings of brain scans and psychological experiments have now revealed that the reality is very different, however. In fact, the brain continues to change all through the teenage years and well into adulthood, and important neurodevelopmental processes enable it to be moulded by the environment. So adolescence isn’t a critical period of neurological change, much of which is responsible for adolescent behaviour.</p>
<p>Blakemore quotes from a teenager’s diary dated 20 July 1969: ‘I went to arts centre (by myself!) in yellow cords and blouse. Ian was there but didn’t speak to me. Got a rhyme put in my handbag from someone who’s apparently got a crush on me. It’s Nicholas, I think. UGH. Man landed on the moon.’ This may look like amazing – even jaw-dropping – self-absorption. But Blakemore says it’s essential neurological development, because the biological function of adolescence, today and in the past, is the creation of a sense of self. Teens achieve this through creating new allegiances, independent of their parents – which is why their friendships suddenly become extremely important. What is known on social media as FOMO – fear of missing out – may look like an irrational sense of priorities if it means skipping revision to attend a run-of-the-mill get-together, but at that age, nothing matters more than peer approval.</p>
<p>Blakemore designed an experiment to explore this. Adolescents were asked to play an online ball game, with what they believed to be two other players of their own age. In fact, the game was with a computer programmed to ignore the human participants; these found themselves watching the ball being passed between two players on the screen who chose not to include them. She repeated the experiment with adults and found that, while the game lowered the mood and increased the anxiety levels of all participants, the effect was dramatically greater for the teenagers.</p>
<p>In her book, Blakemore also discusses how the neurologically driven preoccupation with peer approval underlies adolescent risk-taking and acute self-consciousness, and how it determines adolescent sleep patterns. It’s fascinating, and I’m curious about the implications. What could be done to accommodate the changes adolescents go through?</p>
<p>Blakemore suggests we might harness the power of peer pressure by getting adolescents to run educational campaigns – for example, on healthy eating. She also mentions schools which have altered their start times to fit in with teenage sleep patterns, though she points out there may be practical issues about implementing this on a wider scale. But generally, she’s wary about putting forward concrete solutions. This seems regrettable, but she insists she’s a scientist rather than a consultant. She doesn’t even like to be asked for parenting advice, although she admits her work does inform her own parenting. When she recently visited her teenage son’s school, he asked her to pretend not to know him. ‘I could’ve been so offended by that. But I thought: “That’s absolutely normal.”’</p>
<p>One thing that makes Blakemore’s empathy and affection for teenagers so striking is its rarity. ‘Yes, I’m a champion of them,’ she agrees. But why does she think so many other adults feel differently? She often thinks about why we find it hilarious to <u>‘take the mickey out of’</u> teenagers. She points out that there are whole comedy shows mocking their behaviour. She wonders if adults do it to <u>cope with</u> their rejection; small children obey, adults want to be with them, but teenagers, through necessity, look for independence, and the older generations <u>feel hurt about</u> this. They <u>resent</u> adolescents’ desire to rebel and their sense of embarrassment when they’re with parents. ‘Our way of dealing with these changes is to <u>sneer at</u> them.’</p>` },
                { type: "mcq", id: 51, question: "51. What is the writer doing in the first paragraph?", options: { A: "outlining how he feels about the way teenagers are generally perceived", B: "giving his reasons for writing a profile of Professor Blakemore", C: "pointing out international variations in teenage behaviour", D: "acknowledging his relative ignorance about teenagers" }, correctAnswer: "D", explanation: "Đáp án D. Tác giả thừa nhận: 'I'd always assumed...', 'I hadn't imagined...', và viết cuốn sách 'for people like me' – tức thừa nhận mình từng thiếu hiểu biết về thanh thiếu niên." },
                { type: "mcq", id: 52, question: "52. The writer suggests that the way teenage behaviour is commonly regarded is unsurprising because ______.", options: { A: "behavioural development is a complex subject", B: "significant progress in relevant areas of study is relatively recent", C: "people’s outlook on life is partly determined by neurological factors", D: "differences between generations will always cause misunderstanding" }, correctAnswer: "B", explanation: "Đáp án B. Đoạn 2: 'This is arguably inevitable. Until 20 years ago, it was assumed...' – các phát hiện mới từ quét não chỉ xuất hiện gần đây." },
                { type: "mcq", id: 53, question: "53. What does the writer suggest is ‘jaw-dropping’ about the teenager’s diary entry?", options: { A: "the strong desire for independence that comes across", B: "the similarity with what young people talk about today", C: "the negative comments about two acquaintances", D: "the focus on personal rather than wider events" }, correctAnswer: "D", explanation: "Đáp án D. Nhật ký chỉ nói về chuyện cá nhân (áo quần, bạn bè...), còn sự kiện con người đặt chân lên Mặt Trăng chỉ được nhắc thoáng qua ở cuối – 'self-absorption'." },
                { type: "mcq", id: 54, question: "54. The experiment described in the fourth paragraph was designed to provide evidence of ______.", options: { A: "how competitive teenagers tend to be", B: "how easily teenagers can be deceived", C: "how sensitive teenagers are to social exclusion", D: "how immersed teenagers can become in video games" }, correctAnswer: "C", explanation: "Đáp án C. Thí nghiệm cho thấy khi bị loại khỏi trò chơi, tâm trạng và mức lo âu của thanh thiếu niên bị ảnh hưởng nhiều hơn hẳn người lớn." },
                { type: "mcq", id: 55, question: "55. In the sixth paragraph, the writer expresses ______.", options: { A: "disappointment at Blakemore’s reluctance to advocate specific policies", B: "enthusiasm for the idea of giving teenagers more responsibility", C: "amusement at Blakemore’s difficulties with her own children", D: "doubt regarding the feasibility of changing school hours" }, correctAnswer: "A", explanation: "Đáp án A. 'But generally, she's wary about putting forward concrete solutions. This seems regrettable...' – tác giả tiếc vì bà ngại đề xuất giải pháp cụ thể." },
                { type: "mcq", id: 56, question: "56. Which underlined words in the final paragraph echo the underlined phrase ‘take the mickey out of’?", options: { A: "cope with", B: "feel hurt about", C: "resent", D: "sneer at" }, correctAnswer: "D", explanation: "Đáp án D. 'take the mickey out of' = chế giễu, châm biếm ≈ 'sneer at' (cười nhạo). Câu cuối: 'Our way of dealing with these changes is to sneer at them.'" },
                { type: "mcq", id: 57, question: "57. The article implies that the primary reason for persistent adult negativity towards teenagers, despite new scientific insights, is ______.", options: { A: "the inherent complexity of applying neuroscientific findings to everyday practicalities", B: "a societal unwillingness to adapt established views on youth and generational authority", C: "insufficient institutional efforts to disseminate modern psychological knowledge widely", D: "teenagers' own challenging behaviours naturally provoking such adult reactions" }, correctAnswer: "D", explanation: "Đáp án D. Đoạn cuối: thanh thiếu niên tìm kiếm sự độc lập, muốn nổi loạn, ngại đi cùng bố mẹ → người lớn cảm thấy tổn thương, bực bội và chế giễu. Các đáp án A, B, C không được bài đề cập." },
 
                { type: "title", text: "Part 4 - Reading (True/False/Not Given, Summary, Short Answer)" },
                { type: "passage", text: `<h3>Why Do We Touch Strangers So Much? A History Of The Handshake Offers Clues</h3>
<p><em>For thousands of years, the handshake has been used for different purposes.</em></p>
<p><strong>A.</strong> There is a lot that can be conveyed in a handshake, a kiss, or a hug. Throughout history, such a greeting was used to signal friendship, finalize a business transaction, or indicate religious devotion. Touching strangers, however, can also transmit other, less beneficial shared outcomes—like disease outbreaks. As fears about COVID-19, or coronavirus, mount, France has warned its citizens to pause their famous cheek kisses, and across the world, business deals are being sealed with an elbow bump. But with histories tracing back thousands of years, both greetings are likely too entrenched to be so easily halted.</p>
<p><strong>B.</strong> A popular theory on the handshake’s origin is that it began as a gesture of peace. Grasping hands proved one was not holding a weapon—and shaking them was a way to ensure a partner had nothing hiding up their sleeve. So far, there has not been any reliable evidence to prove this assumption. Throughout the ancient world, the handshake appears on vases, gravestones, and stone slabs in scenes of weddings, gods making deals, young warriors departing for war, and the newly dead’s arrival to the afterlife. In the literary canon, it stretches to the Iliad and the Odyssey. The handshake’s catch-all utility, used in friendship, romance, and business alike, makes interpretation difficult. “The handshake continues to be a popular image today because we too see it as a complex and ambiguous motif,” writes art historian Glenys Davies in an analysis of its use in classical art.</p>
<p><strong>C.</strong> In America, it is likely that the handshake’s popularity was propelled by 18th century Quakers. In their efforts to eschew the hierarchy and social rank, they found the handshake a more democratic form of greeting to the then-common bow, curtsy, or hat doffing. “In their place, Quakers put the practice of the handshake, extended to everyone regardless of station, as we still do,” writes historian Michael Zuckerman. There may be a scientific explanation for its lasting power. In a 2015 study, researchers in Israel filmed handshakes between hundreds of strangers and found nearly a quarter of participants sniffed their hands afterwards. They theorized that a handshake might be unconsciously used to detect chemical signals, and possibly as a means of communication—just as other animals do by smelling each other.</p>
<p><strong>D.</strong> The kiss-as-greeting has a similarly rich history. It was incorporated into early Christianity and used in religious ceremonies. “In his Epistle to the Romans, St. Paul instructed followers to ‘salute one another with a holy kiss,’” writes Andy Scott in the book One Kiss or Two: In Search of the Perfect Greeting. In the Middle Ages, a kiss was used as a sign of fidelity and to seal agreements like property transfers.</p>
<p><strong>E.</strong> Today, a swift kiss on the cheek known in French as “la bise,” is a standard greeting in much of the world. The word may have originated with the Romans, who had a different term for each type of kiss and called the polite version “basium.” In Paris, two kisses are common. In Provence expect three, and four is the norm in the Loire Valley. The cheek kiss is also common in countries like Egypt, where three kisses is customary, Latin America, and the Philippines. It is thought that during the plague in the 14th century, la bise may have stopped and was not revived again until 400 years later, after the French Revolution. In 2009, la bise was temporarily paused as swine flu became a concern. At the end of February, the French Health Minister advised against it as the coronavirus cases increased. “The reduction in social contacts of a physical nature is advised,” he said. “That includes the practice of the bise.”</p>
<p><strong>F.</strong> In her book Don’t Look, Don’t Touch, behavioural scientist Val Curtis of the London School of Hygiene and Tropical Medicine, says that one possible reason for the kiss and handshake as a greeting is to signify that the other person is trusted enough to share germs with. Because of this, the practice can go in and out of style depending on public health concerns. In a 1929 study, a nurse named Leila Given wrote an article in the American Journal of Nursing lamenting the loss of the last generation’s “finger-tipping and the high handshake” customs in favour of a handshake. She warned that hands “are agents of bacterial transfer” and cited early studies showing that a handshake could easily spread germs. In conclusion, she recommended that Americans adopt the Chinese custom at the time of shaking one’s own hands together when greeting a friend. “At least our bacteria would then stay at home,” she wrote.</p>` },

                { type: "mcq", id: 58, question: "58. Shaking hands is an indicator of hospitality.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "NOT_GIVEN", explanation: "Đáp án: NOT GIVEN. Đoạn A chỉ nói lời chào dùng để thể hiện tình bạn, chốt giao dịch, lòng sùng đạo – không nhắc đến 'hospitality' (lòng hiếu khách)." },
                { type: "mcq", id: 59, question: "59. Evidence showed that the handshake started as a sign of peace.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "FALSE", explanation: "Đáp án: FALSE. Đoạn B: 'there has not been any reliable evidence to prove this assumption' – chưa có bằng chứng đáng tin cậy." },
                { type: "mcq", id: 60, question: "60. When shaking hands, people often rolled up their sleeves.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "NOT_GIVEN", explanation: "Đáp án: NOT GIVEN. Đoạn B chỉ nói bắt tay để chắc chắn đối phương không giấu gì trong tay áo, không nói việc xắn tay áo." },
                { type: "mcq", id: 61, question: "61. The use of a handshake in different situations can be unpredictable.", options: { TRUE: "TRUE", FALSE: "FALSE", NOT_GIVEN: "NOT GIVEN" }, correctAnswer: "TRUE", explanation: "Đáp án: TRUE. Đoạn B: bắt tay được dùng trong tình bạn, tình yêu, kinh doanh nên 'makes interpretation difficult'; 'complex and ambiguous motif' – khó lường, khó giải nghĩa." },

                { type: "info", text: "<strong>Questions 65-68: Complete the summary below. Choose NO MORE THAN THREE WORDS AND/OR A NUMBER from the passage for each answer.</strong><br><br><strong>The history of cheek kissing</strong><br>In the past, Christian used cheek kisses in (65)______. In the Middle Age, the kiss-as-greeting was used to show (66)______ or used in making agreements. At present, it is a norm for people almost all over the world to greet each other. In Rome, people named different types of kisses in different ways. It is common for people in Paris to exchange (67)______. The standard is three in Provence and four in the Loire Valley. A kiss on the cheek is also popular among people of Egypt, Latin America and the Philippines. People believe that in the 14th century, the cheek kiss might have been paused and it remained so for 400 years. In 2009, due to (68)______ cheek kisses were also stopped for a while." },
                { type: "fill", id: 65, question: "65. Blank (65)", correctAnswer: "religious ceremonies", explanation: "Đáp án: religious ceremonies. Đoạn D: 'incorporated into early Christianity and used in religious ceremonies'." },
                { type: "fill", id: 66, question: "66. Blank (66)", correctAnswer: "fidelity", explanation: "Đáp án: fidelity. Đoạn D: 'In the Middle Ages, a kiss was used as a sign of fidelity...'." },

    const ATTEMPT_STORAGE_KEY = "pony_exam_attempts_v1";
    const LAST_EXAM_STORAGE_KEY = "pony_exam_last_id";
    let currentExamId = null;
    let currentExamData = [];
    let currentAnswers = {};
    let currentAttempt = {};
    let attemptRecords = {};
    let totalQuestions = 0;

    try {
        attemptRecords = JSON.parse(localStorage.getItem(ATTEMPT_STORAGE_KEY) || "{}") || {};
    } catch (error) {
        attemptRecords = {};
    }

    function initExamPicker() {
        const picker = document.getElementById('exam-picker');
        picker.innerHTML = examDatabase.map(exam => `<option value="${exam.id}">${exam.title}</option>`).join('');
        picker.addEventListener('change', () => loadExam(picker.value));

        const resumableExam = examDatabase
            .filter(exam => attemptRecords[exam.id]?.status === "in-progress")
            .sort((first, second) => (attemptRecords[second.id].updatedAt || 0) - (attemptRecords[first.id].updatedAt || 0))[0];
        const lastExamId = localStorage.getItem(LAST_EXAM_STORAGE_KEY);
        const initialExamId = examDatabase.some(exam => exam.id === lastExamId) ? lastExamId : resumableExam?.id || examDatabase[0]?.id;
        if (initialExamId) loadExam(initialExamId);
    }

    function persistCurrentAttempt() {
        if (!currentExamId) return;
        const existing = attemptRecords[currentExamId] || {};
        currentAttempt = {
            ...existing,
            status: existing.status === "completed" ? "completed" : "in-progress",
            studentName: document.getElementById('student_name').value,
            studentEmail: document.getElementById('student_email').value,
            answers: currentAnswers,
            updatedAt: Date.now()
        };
        attemptRecords[currentExamId] = currentAttempt;
        localStorage.setItem(ATTEMPT_STORAGE_KEY, JSON.stringify(attemptRecords));
        localStorage.setItem(LAST_EXAM_STORAGE_KEY, currentExamId);
    }

    function saveAnswer(questionId, value) {
        currentAnswers[questionId] = value;
        persistCurrentAttempt();
    }

    function escapeAttribute(value) {
        return String(value ?? '').replace(/[&"<>]/g, character => ({
            '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;'
        })[character]);
    }

    function loadExam(examId) {
        const exam = examDatabase.find(e => e.id === examId);
        if (!exam) return;

        if (currentExamId && currentExamId !== examId) persistCurrentAttempt();
        currentExamId = examId;
        document.getElementById('exam-picker').value = examId;
        currentAttempt = attemptRecords[examId] || {};
        currentAnswers = { ...(currentAttempt.answers || {}) };
        currentExamData = exam.data;
        totalQuestions = 0;
        
        document.getElementById('display-exam-title').innerText = exam.title;
        document.getElementById('student_name').value = currentAttempt.studentName || '';
        document.getElementById('student_email').value = currentAttempt.studentEmail || '';
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        document.getElementById('result-container').style.display = 'none';
        
        const btn = document.getElementById('submit-btn');
        const isCompleted = currentAttempt.status === "completed";
        btn.style.display = 'block';
        btn.disabled = isCompleted;
        btn.innerText = isCompleted ? "Đã nộp bài - kết quả đã lưu" : "Nộp bài & Chấm điểm 🐚";

        currentExamData.forEach((q) => {
            if (q.type === "title") {
                const div = document.createElement('div');
                div.className = 'section-title';
                div.innerHTML = q.text;
                container.appendChild(div);
                return;
            }
            if (q.type === "passage") {
                const div = document.createElement('div');
                div.className = 'glass-panel passage-block';
                div.innerHTML = q.text;
                container.appendChild(div);
                return;
            }
            if (q.type === "info") {
                const div = document.createElement('div');
                div.className = 'info-box';
                div.innerHTML = q.text;
                container.appendChild(div);
                return;
            }

            const qDiv = document.createElement('div');
            qDiv.className = 'glass-panel question-block';
            qDiv.id = `question-block-${q.id}`;
            
            let inputHtml = '';
            
            if (q.type === "mcq") {
                totalQuestions++;
                let optionsHtml = '';
                for (const [key, value] of Object.entries(q.options)) {
                    optionsHtml += `
                        <li>
                            <label class="custom-radio-label">
                                <input type="radio" name="q_${q.id}" value="${key}" ${currentAnswers[q.id] === key ? 'checked' : ''} onchange="saveAnswer(${q.id}, this.value)">
                                <span class="radio-mark"></span>
                                <span class="option-text"><strong>${key}.</strong> ${value}</span>
                            </label>
                        </li>`;
                }
                inputHtml = `<ul class="options">${optionsHtml}</ul>`;
            } 
            else if (q.type === "fill") {
                totalQuestions++;
                inputHtml = `<input type="text" class="premium-input" id="input_${q.id}" value="${escapeAttribute(currentAnswers[q.id])}" placeholder="Nhập đáp án của cậu vào đây..." oninput="saveAnswer(${q.id}, this.value)">`;
            }
            else if (q.type === "dropdown") {
                totalQuestions++;
                let opts = `<option value="" disabled ${currentAnswers[q.id] ? '' : 'selected'}>-- Chọn đáp án --</option>`;
                q.options.forEach(opt => { opts += `<option value="${opt}" ${currentAnswers[q.id] === opt ? 'selected' : ''}>${opt}</option>`; });
                inputHtml = `<select class="premium-select" id="input_${q.id}" onchange="saveAnswer(${q.id}, this.value)">${opts}</select>`;
            }
            else if (q.type === "essay") {
                inputHtml = `<textarea class="premium-textarea" id="input_${q.id}" placeholder="Viết bài luận của cậu tại đây nhé..." oninput="saveAnswer(${q.id}, this.value)"></textarea>`;
            }

            let expHtml = q.explanation ? `<div class="explanation" id="exp-${q.id}"><strong>🐚 Giải thích:</strong><br>${q.explanation}</div>` : '';

            qDiv.innerHTML = `
                <div class="question-text">${q.question.replace(/\n/g, '<br>')}</div>
                ${inputHtml}
                ${expHtml}
            `;
            container.appendChild(qDiv);
            if (q.type === "essay") document.getElementById(`input_${q.id}`).value = currentAnswers[q.id] || '';
        });
        
        document.querySelector('.main-content').scrollTo(0, 0);
        persistCurrentAttempt();
        if (isCompleted) restoreSubmittedReview();
    }

    function restoreSubmittedReview() {
        currentExamData.forEach(q => {
            if (!['mcq', 'fill', 'dropdown'].includes(q.type)) return;
            const block = document.getElementById(`question-block-${q.id}`);
            const explanation = document.getElementById(`exp-${q.id}`);
            if (!block) return;

            const answer = String(currentAnswers[q.id] || '').trim().toLowerCase();
            const isCorrect = answer !== '' && answer === String(q.correctAnswer).trim().toLowerCase();
            block.style.borderColor = !answer ? '#fbbf24' : isCorrect ? '#34d399' : '#fb7185';
            block.style.backgroundColor = !answer ? 'rgba(254, 243, 199, 0.7)' : isCorrect ? 'rgba(209, 250, 229, 0.7)' : 'rgba(254, 226, 226, 0.7)';
            if (explanation) explanation.style.display = 'block';
        });

        document.querySelectorAll('#questions-container input, #questions-container select, #questions-container textarea').forEach(input => { input.disabled = true; });
        document.getElementById('score-text').innerText = `${currentAttempt.score} / ${currentAttempt.totalQuestions}`;
        document.getElementById('result-container').style.display = 'block';
        updateDeliveryMessage(currentAttempt.deliveryStatus || 'saved');
    }

    function storeAttemptRecords() {
        localStorage.setItem(ATTEMPT_STORAGE_KEY, JSON.stringify(attemptRecords));
    }

    function updateDeliveryMessage(status) {
        const message = document.getElementById('result-message');
        const btn = document.getElementById('submit-btn');
        if (status === 'sent') {
            message.innerText = 'Kết quả đã được gửi cho giáo viên và lưu trên trình duyệt này.';
            btn.innerText = 'Đã nộp bài & gửi thành công';
        } else if (status === 'error') {
            message.innerText = 'Điểm và bài làm đã được lưu trên trình duyệt này, nhưng chưa gửi được qua mạng.';
            btn.innerText = 'Đã lưu kết quả trên thiết bị';
        } else {
            message.innerText = 'Điểm số và bài làm được lưu trên trình duyệt này để cậu xem lại.';
            btn.innerText = 'Đã nộp bài - kết quả đã lưu';
        }
    }

    async function submitQuiz() {
        if (currentAttempt.status === "completed") return;
        const studentName = document.getElementById('student_name').value.trim();
        const studentEmail = document.getElementById('student_email').value.trim();
        const examTitle = document.getElementById('display-exam-title').innerText;
        
        if (!studentName || !studentEmail) {
            alert("🐚 Cậu quên điền Họ tên hoặc Email rồi kìa!");
            document.getElementById('student_name').focus();
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "Đang chấm điểm và gửi bài... 🌊";

        let score = 0;
        let essayContent = "";
        
        // 1. TÍNH ĐIỂM
        currentExamData.forEach(q => {
            if (q.type === "essay") {
                const eVal = document.getElementById(`input_${q.id}`);
                if (eVal) essayContent = eVal.value;
                return;
            }

            if (!["mcq", "fill", "dropdown"].includes(q.type)) return;

            const block = document.getElementById(`question-block-${q.id}`);
            const exp = document.getElementById(`exp-${q.id}`);
            let isCorrect = false;
            let answered = false;

            if (q.type === "mcq") {
                const sel = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (sel) {
                    answered = true;
                    if (sel.value === q.correctAnswer) isCorrect = true;
                }
            } else {
                const inputEl = document.getElementById(`input_${q.id}`);
                const val = inputEl ? inputEl.value.trim().toLowerCase() : "";
                if (val !== "") {
                    answered = true;
                    if (val === q.correctAnswer.toLowerCase()) isCorrect = true;
                }
            }

            if (answered) {
                if (isCorrect) {
                    score++;
                    block.style.borderColor = "#34d399";
                    block.style.backgroundColor = "rgba(209, 250, 229, 0.7)";
                } else {
                    block.style.borderColor = "#fb7185";
                    block.style.backgroundColor = "rgba(254, 226, 226, 0.7)";
                }
            } else {
                block.style.borderColor = "#fbbf24";
                block.style.backgroundColor = "rgba(254, 243, 199, 0.7)";
            }
            
            if (exp) exp.style.display = "block";
        });

        // Save the score before attempting network delivery.
        currentAttempt = {
            ...currentAttempt,
            status: "completed",
            studentName,
            studentEmail,
            answers: currentAnswers,
            score,
            totalQuestions,
            essayContent,
            deliveryStatus: "pending",
            updatedAt: Date.now()
        };
        attemptRecords[currentExamId] = currentAttempt;
        storeAttemptRecords();

        // 2. HIỂN THỊ KẾT QUẢ NGAY LẬP TỨC
        restoreSubmittedReview();
        document.getElementById('result-container').scrollIntoView({ behavior: 'smooth', block: 'center' });

        // 3. GỬI DỮ LIỆU ĐẾN FORMSPREE
        const FORMSPREE_URL = "https://formspree.io/f/mkjgqkrd"; 
        
        const payloadData = {
            _subject: `[KẾT QUẢ THI] - ${studentName} - ${examTitle} (${score}/${totalQuestions})`,
            exam_title: examTitle,
            student_name: studentName,
            email: studentEmail,
            score: `${score} / ${totalQuestions}`,
            essay_content: essayContent || "[Học sinh không viết bài luận]"
        };

        try {
            const response = await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json' 
                },
                body: JSON.stringify(payloadData)
            });

            if (response.ok) {
                currentAttempt.deliveryStatus = 'sent';
                storeAttemptRecords();
                updateDeliveryMessage('sent');
            } else {
                const resData = await response.json();
                console.warn("Lỗi phản hồi từ Formspree:", resData);
                currentAttempt.deliveryStatus = 'error';
                storeAttemptRecords();
                updateDeliveryMessage('error');
            }
        } catch (error) {
            console.error("Lỗi kết nối:", error);
            currentAttempt.deliveryStatus = 'error';
            storeAttemptRecords();
            updateDeliveryMessage('error');
        }
	}

    document.getElementById('student_name').addEventListener('input', persistCurrentAttempt);
    document.getElementById('student_email').addEventListener('input', persistCurrentAttempt);
    window.addEventListener('beforeunload', persistCurrentAttempt);
    initExamPicker();
</script>
</body>
</html>
