        {
            id: "exam_bacninh_2026",
            title: "Đề thi vào 10 chuyên Bắc Ninh 2026",
            data: [
                { type: "title", text: "PART TWO: LEXICO-GRAMMAR (20 POINTS) - Part 1" },
                { type: "info", text: "<strong>I. Write the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions. (10 pts.)</strong>" },
                { type: "mcq", id: 101, question: "1. The car is suffering engine failure. It is imperative that its engine _______", options: { A: "is completely checked", B: "were completely checked", C: "be completely checked", D: "had been completely checked" }, correctAnswer: "C", explanation: "Đáp án C. Cấu trúc bàng thái cách (Subjunctive) với 'It is imperative that + S + (should) + V-inf'. Động từ ở dạng bị động nên dùng 'be completely checked'." },
                { type: "mcq", id: 102, question: "2. The property encompassed about eighty thousand acres, _______", options: { A: "is seven times the area of Manhattan Island", B: "seven times the area of Manhattan Island", C: "the area of Manhattan Island seven times", D: "the area of seven times Manhattan Island" }, correctAnswer: "B", explanation: "Đáp án B. Đây là cụm danh từ đồng vị (appositive) bổ sung ý nghĩa cho 'eighty thousand acres', hoặc có thể hiểu là mệnh đề quan hệ rút gọn (which is seven times...)." },
                { type: "mcq", id: 103, question: "3. Having been degraded by years of industrial pollution. _______", options: { A: "an environmental restoration program now focuses on the coastal wetlands", B: "focus by environmental restoration program now remains on the coastal wetlands", C: "the coastal wetlands are now the focus of an environmental restoration program", D: "the coastal wetlands are now being focused on an environmental restoration program" }, correctAnswer: "C", explanation: "Đáp án C. Sự hòa hợp chủ ngữ ở mệnh đề phân từ: Chủ ngữ của vế sau phải là đối tượng chịu tác động của việc 'degraded by years of industrial pollution' (bị suy thoái do ô nhiễm), do đó 'the coastal wetlands' (vùng đất ngập nước ven biển) làm chủ ngữ là chính xác nhất." },
                { type: "mcq", id: 104, question: "4. Changes in temperature and precipitation can negatively affect breeding habits, alter migration routes, and _______ the delicate balance between predators and preys.", options: { A: "manage", B: "disturb", C: "sustain", D: "redress" }, correctAnswer: "B", explanation: "Đáp án B. 'disturb' (làm xáo trộn, làm mất). Phù hợp với ngữ cảnh phá vỡ sự cân bằng mong manh (delicate balance) giữa thú săn mồi và con mồi." },
                { type: "mcq", id: 105, question: "5. For mountain-climbing, a really good sleeping-bag is _______.", options: { A: "attainable", B: "verifiable", C: "undeniable", D: "indispensable" }, correctAnswer: "D", explanation: "Đáp án D. 'indispensable' (không thể thiếu, vô cùng quan trọng). Túi ngủ tốt là vật dụng không thể thiếu khi leo núi." },
                { type: "mcq", id: 106, question: "6. The house _______ a commanding position at the top of the valley.", options: { A: "indicates", B: "occupies", C: "illustrates", D: "determines" }, correctAnswer: "B", explanation: "Đáp án B. Collocation: 'occupy a commanding position' (nằm ở vị trí đắc địa, có tầm nhìn bao quát)." },
                { type: "mcq", id: 107, question: "7. _______ such as a company car or stock options, I would have considered applying for the position.", options: { A: "Should the company provide fringe benefits", B: "But for the company's fringe benefits", C: "If the company didn't provide fringe benefits", D: "Had the company provided fringe benefits" }, correctAnswer: "D", explanation: "Đáp án D. Đảo ngữ của câu điều kiện loại 3: 'Had + S + Vp2'. Ngữ cảnh: Nếu công ty cung cấp các phúc lợi phụ..., tôi đã cân nhắc ứng tuyển." },
                { type: "mcq", id: 108, question: "8. _______ has forced many schools to change their cafeteria menu.", options: { A: "That most students prefer buying sugary snacks instead of healthy meals", B: "What most students prefer buying sugary snacks instead of healthy meals", C: "Fact of most students prefer buying sugary snacks instead of healthy meals", D: "Most students prefer buying sugary snacks instead of healthy meals" }, correctAnswer: "A", explanation: "Đáp án A. Mệnh đề danh ngữ bắt đầu bằng 'That + S + V' đóng vai trò làm chủ ngữ số ít cho động từ 'has forced' (Việc phần lớn học sinh thích mua đồ ăn vặt có đường...)." },
                { type: "mcq", id: 109, question: "9. There was a power failure, _______ the whole computer system to shut down.", options: { A: "caused", B: "to cause", C: "causing", D: "causes" }, correctAnswer: "C", explanation: "Đáp án C. Rút gọn mệnh đề quan hệ mang nghĩa chủ động (which caused -> causing), thay thế cho toàn bộ sự việc phía trước." },
                { type: "mcq", id: 110, question: "10. The use of robots has _______ boring low-paid factory jobs.", options: { A: "done away with", B: "put down for", C: "passed on to", D: "made up for" }, correctAnswer: "A", explanation: "Đáp án A. Phrasal verb 'do away with' = eliminate/abolish (loại bỏ, xóa bỏ)." },
                { type: "mcq", id: 111, question: "11. It is claimed that the economy is improving, but this survey suggests _______.", options: { A: "certainly", B: "seriously", C: "otherwise", D: "nonetheless" }, correctAnswer: "C", explanation: "Đáp án C. 'suggest otherwise' (cho thấy điều ngược lại). Cuộc khảo sát cho thấy nền kinh tế không hề cải thiện." },
                { type: "mcq", id: 112, question: "12. It is common knowledge that exams are done under strict time _______.", options: { A: "processes", B: "boundaries", C: "signals", D: "constraints" }, correctAnswer: "D", explanation: "Đáp án D. Collocation: 'time constraints' (sự giới hạn, áp lực về thời gian)." },
                { type: "mcq", id: 113, question: "13. When treating any health problem, it's always important to consider the _______ causes.", options: { A: "underlying", B: "deserving", C: "worthwhile", D: "sufficient" }, correctAnswer: "A", explanation: "Đáp án A. Collocation: 'underlying causes' (nguyên nhân gốc rễ, sâu xa)." },
                { type: "mcq", id: 114, question: "14. The arguments about who should be _______ to vote brought registration to a halt.", options: { A: "respectable", B: "eligible", C: "admissible", D: "reasonable" }, correctAnswer: "B", explanation: "Đáp án B. 'eligible to do sth' (đủ tư cách, đủ điều kiện để làm gì - ở đây là đủ điều kiện bỏ phiếu)." },
                { type: "mcq", id: 115, question: "15. The medical equipment of the hospital is a bit _______. This reduces the quality of disease diagnosis and treatment.", options: { A: "ahead of its time", B: "high and low", C: "behind the times", D: "like nothing on earth" }, correctAnswer: "C", explanation: "Đáp án C. Idiom 'behind the times' (lạc hậu, lỗi thời). Các thiết bị y tế đã cũ làm giảm chất lượng chẩn đoán." },
                { type: "mcq", id: 116, question: "16. By definition, hyperactive children _______ to keep still or be quiet for very long.", options: { A: "find it difficult", B: "find it to be difficult", C: "find them difficult", D: "find difficult" }, correctAnswer: "A", explanation: "Đáp án A. Cấu trúc 'find + it + adj + to V' (cảm thấy như thế nào khi làm gì)." },
                { type: "mcq", id: 117, question: "17. The government has _______ plans for new legislation to protect disadvantaged children.", options: { A: "addressed", B: "disrupted", C: "reflected", D: "unveiled" }, correctAnswer: "D", explanation: "Đáp án D. 'unveil plans' (tiết lộ, công bố kế hoạch). Chính phủ đã công bố kế hoạch ban hành luật mới." },
                { type: "mcq", id: 118, question: "18. Since our research so far has not produced any answers to this problem, we need to adopt a different _______ to it.", options: { A: "approach", B: "criterion", C: "mannerism", D: "procedure" }, correctAnswer: "A", explanation: "Đáp án A. Collocation: 'adopt a different approach to sth' (áp dụng một phương pháp tiếp cận khác)." },
                { type: "mcq", id: 119, question: "19. Two friends are talking about food production.\nFreda: I feel that the term 'organic production' is being abused.\nMandy: _______. Many manufacturers still use harmful chemicals in the production of the so-called 'organic food'.", options: { A: "I don't think so", B: "I couldn't agree more", C: "Feel free to ask", D: "I'm not with you" }, correctAnswer: "B", explanation: "Đáp án B. 'I couldn't agree more' (Tôi hoàn toàn đồng ý). Vế sau Mandy giải thích thêm củng cố ý kiến của Freda." },
                { type: "mcq", id: 120, question: "20. Kayla has helped Julian a lot in his medical research.\nJulian: Thank you very much for your help.\nKayla: _______.", options: { A: "Not at all", B: "Come what may", C: "Be my guest", D: "That figures" }, correctAnswer: "A", explanation: "Đáp án A. 'Not at all' thường dùng để đáp lại lời cảm ơn một cách lịch sự (Không có gì đâu)." },
                
                { type: "title", text: "Part 2 - Word Formation" },
                { type: "info", text: "<strong>II. Complete the sentence in each of the following questions by giving the correct form of the given word. (5 pts.)</strong>" },
                { type: "fill", id: 121, question: "1. Larry, with _______ generosity, invited everyone back to his house. (CHARACTER)", correctAnswer: "characteristic", explanation: "Đáp án: characteristic. Cần tính từ đứng trước danh từ 'generosity' (sự hào phóng mang tính đặc trưng của Larry)." },
                { type: "fill", id: 122, question: "2. We appreciate your _______ to our administration and your help at a time when needed. (DEDICATE)", correctAnswer: "dedication", explanation: "Đáp án: dedication. Đứng sau tính từ sở hữu 'your' cần một danh từ (sự cống hiến)." },
                { type: "fill", id: 123, question: "3. The firefighters wore respirators to help them _______ in the smoke-filled house. (BREATH)", correctAnswer: "breathe", explanation: "Đáp án: breathe. Đứng sau 'help them' cần động từ nguyên thể (hít thở)." },
                { type: "fill", id: 124, question: "4. The universities could coordinate _______ learning packages for their graduates in various hospitals. (DISTANT)", correctAnswer: "distance", explanation: "Đáp án: distance. Dùng trong cụm danh từ ghép 'distance learning' (học từ xa)." },
                { type: "fill", id: 125, question: "5. All outstanding bills will be paid by the previous _______. (OCCUPY)", correctAnswer: "occupant", explanation: "Đáp án: occupant (hoặc occupants). Cần danh từ chỉ người (người thuê trước đây)." },
                { type: "fill", id: 126, question: "6. 'You've only got yourself to blame,' she said _______. (SYMPATHY)", correctAnswer: "unsympathetically", explanation: "Đáp án: unsympathetically. Cần trạng từ bổ nghĩa cho động từ 'said'. Ngữ nghĩa câu cho thấy cô ấy nói một cách vô tâm/không cảm thông." },
                { type: "fill", id: 127, question: "7. He didn't drink because he was the _______ driver who drove the others home safely. (DESIGNATE)", correctAnswer: "designated", explanation: "Đáp án: designated. Cụm từ quen thuộc 'designated driver' (người được chỉ định lái xe, thường không uống rượu để đưa mọi người về an toàn)." },
                { type: "fill", id: 128, question: "8. Medical _______ are seen as having the required expert knowledge permitting them legally to prescribe drugs... (PRACTISE)", correctAnswer: "practitioners", explanation: "Đáp án: practitioners. Cụm từ 'medical practitioners' (người hành nghề y/bác sĩ)." },
                { type: "fill", id: 129, question: "9. Perhaps, in a science as complex as _______, computer models are imperfect. (CLIMATE)", correctAnswer: "climatology", explanation: "Đáp án: climatology. Đứng sau 'complex as' cần một danh từ chỉ môn khoa học (Khí hậu học)." },
                { type: "fill", id: 130, question: "10. Constant correction by a teacher is often _______, as the student may become afraid to speak at all. (PRODUCE)", correctAnswer: "counterproductive", explanation: "Đáp án: counterproductive. Mang nghĩa 'phản tác dụng' do học sinh sẽ trở nên sợ nói tiếng Anh." },
                
                { type: "title", text: "Part 3 - Error Identification" },
                { type: "info", text: "<strong>III. There are FIVE mistakes in the following text. Identify the mistakes and give the corrections. An example has been done for you. (5 pts.)</strong>" },
                { 
                    type: "passage", 
                    text: `<div style="font-family: 'Times New Roman', Times, serif; font-size: 1.15em; line-height: 1.8; padding: 25px; background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: inset 0 0 10px rgba(0,0,0,0.02); color: #000;">
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(1)</span><div>We often worry about lying wake in the middle of the night but it can be good for you.</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(2)</span><div>Indications from both science and history suggest that the eight-hours sleep may not be</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(3)</span><div>natural or inborn for humans. In the early 1990s, psychiatrist Thomas Wehr conducted a</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(4)</span><div>research in which Wehr kept a group of people in a darkened room for 14 hours a day for a</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(5)</span><div>month. It took some time for their sleep regulate, but by the fourth week the subjects had</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(6)</span><div>settled into a very distinct sleep pattern. Firstly, they slept four hours, then woke for one or</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(7)</span><div>two hours before falling into a third four-hour sleep. Sleep scientists were impressed by the</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(8)</span><div>implications of the study.</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(9)</span><div>Sleep psychologist, Gregg Jacobs, says that the idea that we must sleep for an extended</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(10)</span><div>period of time can change. 'It makes people who wake up in the night anxious, as this</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(11)</span><div>anxiety can itself discourage sleep and is likely to affect waking life, too, Jacobs says.</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(12)</span><div>Russell Foster, a professor of circadian (body clock) neuroscience at Oxford University in</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(13)</span><div>the UK, shares this point of view. 'Over 30% of the medical problems that doctors face with</div></div>
                        <div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(14)</span><div>stem directly or indirectly from sleep,' Foster says.</div></div>
                        <div style="margin-top: 20px; font-weight: bold; color: var(--primary-dark);">Your answers: (0) line 2: eight-hours &rarr; eight-hour</div>
                    </div>` 
                },
                { type: "fill", id: 131, question: "1. Line 1 (Lỗi: wake) &rarr; Sửa thành:", correctAnswer: "awake", explanation: "Đáp án: awake. Cụm từ chính xác là 'lie awake' (nằm trằn trọc, thức giấc)." },
                { type: "fill", id: 132, question: "2. Line 4 (Lỗi: a research) &rarr; Sửa thành:", correctAnswer: "research", explanation: "Đáp án: research (hoặc a study). 'Research' là danh từ không đếm được nên không dùng mạo từ 'a' phía trước." },
                { type: "fill", id: 133, question: "3. Line 5 (Lỗi: regulate) &rarr; Sửa thành:", correctAnswer: "to regulate", explanation: "Đáp án: to regulate. Cấu trúc 'take time for sth to do sth' (mất thời gian để làm gì)." },
                { type: "fill", id: 134, question: "4. Line 10 (Lỗi: as) &rarr; Sửa thành:", correctAnswer: "and", explanation: "Đáp án: and (hoặc since/because tuỳ văn cảnh sâu, nhưng 'and' liên kết logic nhân quả tự nhiên hơn ở đây - nó làm mọi người lo âu VÀ sự lo âu này...)." },
                { type: "fill", id: 135, question: "5. Line 13 (Lỗi: face with) &rarr; Sửa thành:", correctAnswer: "face", explanation: "Đáp án: face. Động từ 'face' (đối mặt) khi dùng trực tiếp với tân ngữ thì không đi kèm giới từ 'with' trừ dạng bị động (be faced with)." },
            { type: "title", text: "PART THREE: READING (35 POINTS)" },
                
                // --- BÀI ĐỌC 1 ---
                { type: "info", text: "<strong>I. Read the text below and fill in each gap with ONE suitable word. (5 pts.)</strong>" },
                { 
                    type: "passage", 
                    text: "<div style='font-size: 1.1em; line-height: 1.8; color: #0d4f66; text-align: justify;'><p>Recent research has revealed that a third of people in Britain have not met their next-door neighbors, and those who know each other barely speak. 'The sight of neighbors gossiping over garden fences and in the street <b>(1) _______</b> common in the 1950s', said Dr. Carl Chinn, an expert on local communities. Now, however, longer hours spent working at the office, together with the Internet and satellite television, are eroding neighborhood ties. 'Poor neighborhoods <b>(2) _______</b> had strong kinship, but now prosperity buys privacy,' said Dr. Carl.</p><p>Professor John Locke, a social scientist at Cambridge University, has analyzed a large number of surveys. He found that in America and Britain, the amount of time spent in <b>(3) _______</b> activity is decreasing. A third of people said they never spoke to their neighbors at all. Andrew Mayer, a strategy consultant, rents a large apartment in West London, with two flatmates. 'We have a family of teachers upstairs and lawyers below, but our contact comes via letters relating to the communal facilities or complaints <b>(4) _______</b> we've not put out our bin bags properly,' said Mayer.</p><p>The breakdown of communities can have serious effects. Concerned at the rise in burglaries and acts of vandalism, the police have relaunched crime <b>(5) _______</b> schemes such as Neighborhood Watch, calling on people who live in the same neighborhood to keep an eye on each other's houses and report everything they see which is unusual.</p></div>" 
                },
                { type: "fill", id: 301, question: "1. (Điền 1 từ vào chỗ trống số 1)", correctAnswer: "was", explanation: "Đáp án: was. Động từ to-be chia ở thì quá khứ đơn vì chủ ngữ 'The sight' số ít và có dấu hiệu thời gian 'in the 1950s'." },
                { type: "fill", id: 302, question: "2. (Điền 1 từ vào chỗ trống số 2)", correctAnswer: "once", explanation: "Đáp án: once / formerly / previously. Ngữ cảnh tương phản với 'but now' (nhưng bây giờ), thể hiện việc ngày xưa từng có tình làng nghĩa xóm bền chặt." },
                { type: "fill", id: 303, question: "3. (Điền 1 từ vào chỗ trống số 3)", correctAnswer: "social", explanation: "Đáp án: social. Cụm từ 'social activity' (hoạt động xã hội/giao tiếp). Dấu hiệu là ông John Locke là một 'social scientist'." },
                { type: "fill", id: 304, question: "4. (Điền 1 từ vào chỗ trống số 4)", correctAnswer: "that", explanation: "Đáp án: that. Dùng để mở đầu một mệnh đề danh ngữ giải thích cho danh từ 'complaints' (lời phàn nàn RẰNG chúng tôi chưa vứt rác đúng cách)." },
                { type: "fill", id: 305, question: "5. (Điền 1 từ vào chỗ trống số 5)", correctAnswer: "prevention", explanation: "Đáp án: prevention. Cụm danh từ 'crime prevention schemes' (các chương trình phòng chống tội phạm)." },

                // --- BÀI ĐỌC 2 ---
                { type: "info", text: "<strong>II. Read the following passage and write the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks. (10 pts.)</strong>" },
                { 
                    type: "passage", 
                    text: "<div style='font-size: 1.1em; line-height: 1.8; color: #0d4f66; text-align: justify;'><p>Academic success is frequently considered as the combination of academic performance, persistence, and satisfaction. Of these, performance is often treated as the <b>(1) _______</b> indicator, primarily due to its obvious objectivity and gaining of quantification through grades and standardized assessments. However, such reliance may risk privileging <b>(2) _______</b> outcomes over less visible, yet equally consequential, dimensions. While performance can signal attainment, it does not necessarily capture the conditions <b>(3) _______</b> which that attainment is produced.</p><p>Increasingly, <b>(4) _______</b> has shifted toward the underlying factors that shape academic achievements. Although strong performance may appear to reflect competence or effective learning strategies, it can also coexist with less <b>(5) _______</b> challenges, including chronic stress or disengagement. These factors, while not immediately observable, may exert a delayed influence on persistence and satisfaction. For instance, students who initially achieve high results may nonetheless experience <b>(6) _______</b> motivation over time, suggesting that performance alone is an insufficient substitute for long-term academic stability. Importantly, the absence of visible difficulty should not be interpreted as the absence of strain.</p><p>In response, institutions have implemented a range of interventions <b>(7) _______</b> to mitigate the adverse effects associated with these hidden pressures. Such measures often include psychological support services, structured academic guidance, and initiatives aimed at <b>(8) _______</b> social integration. Evidence suggests that these strategies can enhance student engagement, their effectiveness is, <b>(9) _______</b>, not uniform across contexts. In some cases, improvements in retention are evident, yet the extent to which these gains can be <b>(10) _______</b> solely to institutional support remains open to interpretation. This raises questions about whether such interventions address root causes or merely alleviate symptoms.</p></div>" 
                },
                { type: "mcq", id: 306, question: "1. Choose the correct answer for blank (1):", options: { A: "unreliable", B: "predominant", C: "contributory", D: "irrelevant" }, correctAnswer: "B", explanation: "Đáp án B. predominant (chiếm ưu thế). Thành tích học tập thường được coi là chỉ số chính/chiếm ưu thế nhất." },
                { type: "mcq", id: 307, question: "2. Choose the correct answer for blank (2):", options: { A: "measurable", B: "inevitable", C: "statistical", D: "unintended" }, correctAnswer: "A", explanation: "Đáp án A. measurable (có thể đo lường). Ngữ cảnh đang nói về điểm số là những kết quả có thể đo lường được (quantification)." },
                { type: "mcq", id: 308, question: "3. Choose the correct answer for blank (3):", options: { A: "behind", B: "within", C: "from", D: "under" }, correctAnswer: "D", explanation: "Đáp án D. under. Dùng trong cụm 'under conditions' -> 'under which' (trong những điều kiện mà thành tựu đó được tạo ra)." },
                { type: "mcq", id: 309, question: "4. Choose the correct answer for blank (4):", options: { A: "confusion", B: "attitude", C: "perspective", D: "attention" }, correctAnswer: "D", explanation: "Đáp án D. attention. Sự chú ý (attention) ngày càng được chuyển sang các yếu tố nền tảng (underlying factors)." },
                { type: "mcq", id: 310, question: "5. Choose the correct answer for blank (5):", options: { A: "serious", B: "daunting", C: "apparent", D: "continuous" }, correctAnswer: "C", explanation: "Đáp án C. apparent (rõ ràng). Trái ngược với biểu hiện điểm số tốt ra bên ngoài là những khó khăn ít bộc lộ rõ ràng hơn (less apparent)." },
                { type: "mcq", id: 311, question: "6. Choose the correct answer for blank (6):", options: { A: "consistent", B: "individual", C: "increasing", D: "diminishing" }, correctAnswer: "D", explanation: "Đáp án D. diminishing (giảm sút). Học sinh đạt điểm cao lúc đầu nhưng dần dần có thể trải qua sự sụt giảm động lực." },
                { type: "mcq", id: 312, question: "7. Choose the correct answer for blank (7):", options: { A: "intended", B: "intending", C: "intend", D: "to intend" }, correctAnswer: "A", explanation: "Đáp án A. intended. Rút gọn mệnh đề quan hệ dạng bị động (which are intended to mitigate... - được nhằm mục đích giảm nhẹ...)." },
                { type: "mcq", id: 313, question: "8. Choose the correct answer for blank (8):", options: { A: "worsening", B: "governing", C: "fostering", D: "requiring" }, correctAnswer: "C", explanation: "Đáp án C. fostering (thúc đẩy, bồi dưỡng). Các sáng kiến nhằm mục đích thúc đẩy sự hòa nhập xã hội." },
                { type: "mcq", id: 314, question: "9. Choose the correct answer for blank (9):", options: { A: "therefore", B: "however", C: "thereby", D: "although" }, correctAnswer: "B", explanation: "Đáp án B. however (tuy nhiên). Đứng giữa hai dấu phẩy để thể hiện sự tương phản giữa việc các chiến lược này có hiệu quả nhưng lại không đồng đều." },
                { type: "mcq", id: 315, question: "10. Choose the correct answer for blank (10):", options: { A: "attributed", B: "contributed", C: "allocated", D: "adjusted" }, correctAnswer: "A", explanation: "Đáp án A. attributed. Cấu trúc 'be attributed to' (được quy cho/được cho là nhờ vào)." },

		// --- BÀI ĐỌC 3 ---
                { type: "info", text: "<strong>III. Read the following passage and write the letter A, B, C, or D on your answer sheet to indicate the correct answer to each of the following questions. (10 pts.)</strong>" },
                { 
                    type: "passage", 
                    text: "<div style='font-size: 1.1em; line-height: 1.8; color: #0d4f66; text-align: justify;'><p><b>[I]</b> The global-pandemic of 2020 served as an unprecedented catalyst for the education sector, forcing an abrupt transition from traditional brick-and-mortar classrooms to virtual learning environments. <b>[II]</b> Educators and institutions were compelled to proceed with curricula despite the absence of physical proximity, leading to the rapid development of e-learning platforms. <b>[III]</b> Although the suddenness of this transition presented significant logistical obstacles, it also highlighted the limitations of conventional schooling and the vast potential of digital integration in the 21st century. <b>[IV]</b></p><p>One of the primary advantages of e-learning lies in its unparalleled efficiency and personalization. Unlike the \"one-size-fits-all\" approach often found in traditional settings, digital platforms allow for a more student-centered experience. Through Learning Management Systems (LMS), educators can integrate diverse media such as podcasts, interactive simulations, and real-time debates to cater to various learning styles. Furthermore, the availability of precise LMS metrics enables teachers to monitor students' performance with surgical accuracy, allowing for timely interventions. For instance, introverted students, who might feel marginalized in a loud classroom, often find their voice in online discussion forums, where the pressure of immediate verbal response is mitigated.</p><p>Accessibility and flexibility further solidify e-learning's position as a viable alternative to higher education. For adult learners who want to balance professional responsibilities with academic pursuits, the ability to study at one's own pace is indispensable. Research indicates that this autonomy can lead to a 25% to 60% increase in information retention rates, as students can revisit complex lectures until mastery is achieved. Moreover, the rise of Massive Open Online Courses (MOOCs), such as Coursera, has democratized elite education. These platforms provide a bridge for students in developing regions to access certifications from world-renowned corporations like Google, effectively narrowing the global skill gap. This democratization allows a student in a rural village to learn the same concepts as one in a major metropolis.</p><p>Despite its clear benefits, <u>the future of e-learning is not without its skeptics</u>. Critics argue that the lack of face-to-face interaction may diminish the development of essential social skills and collaborative emotional intelligence. However, the consensus among experts suggests that digital learning is no longer a secondary tool but a core component of modern instruction. Rather than resisting this evolution, society must focus on perfecting these tools to ensure they are equitable and inclusive. The goal is not to replace the human element of teaching, but to augment it through technology, creating a future where high-quality education is a universal right rather than a geographic privilege.</p></div>" 
                },
                { type: "mcq", id: 316, question: "1. Which of the following can serve as the title of the passage?", options: { A: "Drawbacks of Traditional Schooling", B: "A Detailed Analysis of E-learning", C: "Educational Platforms in the Pandemic", D: "Benefits and Potential of E-learning" }, correctAnswer: "D", explanation: "Đáp án D. Bài văn tập trung vào việc mô tả những lợi thế (advantages, benefits) và tiềm năng to lớn (vast potential) của e-learning trong tương lai." },
                { type: "mcq", id: 317, question: "2. Where in the passage does the following sentence best fit?\n<i>'While this shift was initially viewed as a temporary emergency measure, it has fundamentally reshaped the way people teach and learn.'</i>", options: { A: "[I]", B: "[II]", C: "[III]", D: "[IV]" }, correctAnswer: "D", explanation: "Đáp án D. Câu này kết nối logic với vế trước đó nói về tiềm năng tích hợp kỹ thuật số, đồng thời mở đầu cho việc phân tích sự thay đổi cơ bản ở các đoạn sau." },
                { type: "mcq", id: 318, question: "3. The word 'marginalized' in paragraph 2 is closest in meaning to", options: { A: "indifferent", B: "insignificant", C: "indecisive", D: "competent" }, correctAnswer: "B", explanation: "Đáp án B. 'marginalized' có nghĩa là bị gạt ra rìa, bị coi là không quan trọng, tương đồng với 'insignificant' (không đáng kể, không quan trọng)." },
                { type: "mcq", id: 319, question: "4. The word 'it' in the last paragraph refers to", options: { A: "the future of e-learning", B: "face-to-face interaction", C: "emotional intelligence", D: "human element of teaching" }, correctAnswer: "D", explanation: "Đáp án D. 'The goal is not to replace the human element of teaching, but to augment it...' -> Đại từ 'it' thay thế cho 'human element of teaching'." },
                { type: "mcq", id: 320, question: "5. Why does the writer mention the situation of introverted students in paragraph 2?", options: { A: "To criticize the setting of traditional schools", B: "To highlight a benefit of e-learning", C: "To prove the need for teachers' intervention", D: "To voice objection to online discussion forums" }, correctAnswer: "B", explanation: "Đáp án B. Tác giả đưa ra ví dụ về học sinh hướng nội để làm nổi bật một lợi ích của e-learning (giúp họ mạnh dạn cất tiếng nói)." },
                { type: "mcq", id: 321, question: "6. E-learning seems to be the optimal choice for adult learners because", options: { A: "they can attend as many lectures as possible", B: "they can choose suitable learning platforms", C: "they are provided with safer learning settings", D: "they are able to learn at their convenience" }, correctAnswer: "D", explanation: "Đáp án D. Đoạn 3 nhắc đến 'the ability to study at one's own pace' (khả năng học theo nhịp độ/tiện lợi cá nhân)." },
                { type: "mcq", id: 322, question: "7. According to paragraph 3, e-learning", options: { A: "offers an obvious alternative to home schooling", B: "fosters learners' independence of digital devices", C: "offers equal access to prestigious institutions", D: "is for those with information retention problems" }, correctAnswer: "C", explanation: "Đáp án C. Thông qua các MOOCs, học sinh có thể tiếp cận được giáo dục ưu tú (democratized elite education) và chứng chỉ từ các tổ chức danh tiếng." },
                { type: "mcq", id: 323, question: "8. Which of the following best paraphrases the underlined sentence in paragraph 4?", options: { A: "There are still concerns about the application of e-learning in the future.", B: "Not a single person is skeptical about the sustainable development of e-learning.", C: "The negative effects e-learning can have on education are inevitable.", D: "It is more and more challenging for educational institutions to apply e-learning." }, correctAnswer: "A", explanation: "Đáp án A. 'not without its skeptics' mang nghĩa là vẫn có những người hoài nghi, lo ngại (concerns) về e-learning." },
                { type: "mcq", id: 324, question: "9. Which of the following can be inferred from paragraph 4?", options: { A: "With its potential, technology will eventually replace human teachers in the future.", B: "Technology shouldn't be a replacement but a facilitator to human teachers.", C: "Human interaction is the only thing that matters in a high-quality education.", D: "Teachers need to work harder to outperform new technology in the long run." }, correctAnswer: "B", explanation: "Đáp án B. Đoạn cuối nhấn mạnh công nghệ không nhằm mục đích thay thế con người, mà là công cụ để hỗ trợ/tạo điều kiện (facilitator)." },
                { type: "mcq", id: 325, question: "10. Which of the following is NOT TRUE according to the passage?", options: { A: "Adult learners often find the flexibility of e-learning beneficial for their careers.", B: "Critics are concerned that online learning might hinder social skill development.", C: "Educators can tailor their lessons to the needs of their students.", D: "Educational institutions were willing to adopt online platforms during the pandemic." }, correctAnswer: "D", explanation: "Đáp án D. Bài đọc dùng từ 'forcing an abrupt transition' (bị ép buộc chuyển đổi), chứ không phải họ tự nguyện/sẵn lòng (willing)." },

                // --- BÀI ĐỌC 4 ---
                { type: "info", text: "<strong>IV. Read the following passage and do the tasks that follow. (10 pts.)</strong>" },
                { 
                    type: "passage", 
                    text: "<div style='font-size: 1.1em; line-height: 1.8; color: #0d4f66; text-align: justify;'><h3>The Paradox of Choice in Modern Consumer Societies</h3><p><strong>A.</strong> In contemporary consumer societies, the expansion of choice is frequently regarded as an unquestionable indicator of progress. Supermarkets now stock hundreds of variations of similar products, while digital platforms allow consumers to browse an almost limitless range of goods and services from across the globe. This abundance is often assumed to enhance personal freedom, enabling individuals to select options that best align with their preferences and values... However, an increasing body of psychological and economic research suggests that the relationship between choice and satisfaction is far more complex than it initially appears, and in some cases may even produce unintended negative consequences for consumers.</p><p><strong>B.</strong> One explanation for this paradox lies in the cognitive demands associated with evaluating numerous alternatives. Each additional option introduces new variables that must be processed, compared, and prioritized. While a small set of choices can be handled with relative ease, a larger assortment may overwhelm an individual's decision-making capacity. As a result, people often experience what researchers describe as \"decision fatigue,\" a condition in which the quality of decisions declines after extended periods of deliberation... In such contexts, individuals may begin to rely on shortcuts or heuristics, which do not always lead to optimal outcomes.</p><p><strong>C.</strong> Beyond the immediate difficulty of making a decision, excessive choice can also influence how individuals feel after a selection has been made. When only a limited number of options are available, people tend to feel more confident that they have made a satisfactory choice. In contrast, when faced with a wide array of alternatives, individuals are more likely to reflect on the possibilities they rejected. This process, commonly referred to as \"counterfactual thinking,\" involves imagining how different choices might have produced better outcomes, thereby reducing satisfaction with the chosen option and increasing feelings of regret, uncertainty, and self-doubt...</p><p><strong>D.</strong> Importantly, the relationship between choice and satisfaction does not follow a simple linear pattern. Increasing the number of options from very few to a moderate level can enhance feelings of autonomy and control. However, once this optimal threshold is exceeded, additional choices begin to have diminishing and eventually negative effects. This inverted relationship highlights the existence of a balance point, beyond which the psychological costs of decision-making outweigh the perceived benefits of having more options. Determining this threshold, however, may vary across individuals...</p><p><strong>E.</strong> The implications of excessive choice extend beyond individual experiences to influence broader patterns of behaviour in modern economies. In markets characterised by intense competition, companies often assume that expanding product lines will attract more consumers and increase overall engagement. Yet empirical studies suggest that an overabundance of options can lead to decision avoidance, where individuals postpone making a choice or abandon the process entirely... In some cases, individuals may even delegate decisions to others simply to avoid the cognitive burden involved.</p><p><strong>F.</strong> Recognising these challenges, some organisations have begun to adopt strategies aimed at simplifying consumer decision-making. Rather than offering an overwhelming number of options, they curate selections that are easier to navigate and compare... These approaches reflect an understanding that freedom of choice is most beneficial when it is accompanied by clarity and support.</p><p><strong>G.</strong> Ultimately, the paradox of choice reveals a fundamental tension within modern economic systems. While technological advancement has made it possible to expand the range of available options, human cognitive capacity remains inherently limited. As a result, the challenge lies not in increasing choice indefinitely, but in designing environments that enable individuals to make effective decisions without becoming overwhelmed...</p></div>" 
                },
                { type: "info", text: "<strong>For questions 1-4, match the paragraphs (A-D) with the most suitable headings (i-vi). There are two extra options that you do not need to use.</strong><br>i. The positive correlation between choice and satisfaction<br>ii. How to determine the optimal number of choices<br>iii. The benefits of the abundance of choice<br>iv. The paradox of choice at first glance<br>v. Negative emotions after making decisions<br>vi. Uninformed decisions due to excessive choice" },
                { type: "dropdown", id: 326, question: "1. Paragraph A", options: ["i", "ii", "iii", "iv", "v", "vi"], correctAnswer: "iv", explanation: "Đoạn A giới thiệu cái nhìn tổng quan ban đầu về nghịch lý của sự lựa chọn: tưởng chừng mang lại tự do nhưng lại ẩn chứa hệ quả tiêu cực." },
                { type: "dropdown", id: 327, question: "2. Paragraph B", options: ["i", "ii", "iii", "iv", "v", "vi"], correctAnswer: "vi", explanation: "Đoạn B giải thích việc mệt mỏi khi ra quyết định ('decision fatigue') dẫn tới việc dựa vào lối tắt (shortcuts), gây ra các quyết định thiếu sáng suốt (uninformed decisions)." },
                { type: "dropdown", id: 328, question: "3. Paragraph C", options: ["i", "ii", "iii", "iv", "v", "vi"], correctAnswer: "v", explanation: "Đoạn C mô tả cảm giác hối tiếc, nghi ngờ bản thân (regret, uncertainty, self-doubt) xảy ra sau khi một lựa chọn đã được đưa ra." },
                { type: "dropdown", id: 329, question: "4. Paragraph D", options: ["i", "ii", "iii", "iv", "v", "vi"], correctAnswer: "ii", explanation: "Đoạn D bàn về điểm cân bằng, ngưỡng tối ưu (optimal threshold/balance point) của việc đưa ra lựa chọn." },
                { type: "info", text: "<strong>For questions 5-8, decide whether the following statements are True (T), False (F), or Not Given (NG).</strong>" },
                { type: "mcq", id: 330, question: "5. A significant amount of identical goods are on display at supermarkets to attract customers.", options: { T: "True", F: "False", NG: "Not Given" }, correctAnswer: "F", explanation: "Đáp án: False. Bài đọc viết 'hundreds of variations of similar products' (biến thể của các sản phẩm tương tự), chứ không phải là 'identical goods' (sản phẩm giống hệt nhau)." },
                { type: "mcq", id: 331, question: "6. One may experience \"decision fatigue\" as he fails to handle a wide variety of choices.", options: { T: "True", F: "False", NG: "Not Given" }, correctAnswer: "T", explanation: "Đáp án: True. Khớp với nội dung đoạn B: 'a larger assortment may overwhelm an individual's decision-making capacity. As a result, people often experience... decision fatigue'." },
                { type: "mcq", id: 332, question: "7. The final choice is often the least favored of the decision-maker.", options: { T: "True", F: "False", NG: "Not Given" }, correctAnswer: "NG", explanation: "Đáp án: Not Given. Bài đọc không hề khẳng định lựa chọn cuối cùng là lựa chọn ít được yêu thích nhất." },
                { type: "mcq", id: 333, question: "8. That the number of choices remains stable at all times offers people positive feelings.", options: { T: "True", F: "False", NG: "Not Given" }, correctAnswer: "NG", explanation: "Đáp án: Not Given. Bài đọc không đề cập đến việc giữ số lượng lựa chọn cố định ở mọi thời điểm sẽ đem lại cảm xúc tích cực." },
                { type: "info", text: "<strong>For questions 9-10, read the summary and fill in each gap with NO MORE THAN THREE WORDS from the passage.</strong><br>Excessive choice has a profound effect on personal experiences as well as patterns of behaviors in different fields. Some individuals tend to delay their decision making, or eliminate this process entirely. Some assign it to others as they do not want to bear the (9) _______. To solve this problem, businesses offer options that customers can (10) _______ at ease." },
                { type: "fill", id: 334, question: "9. (Điền tối đa 3 từ vào chỗ trống số 9)", correctAnswer: "cognitive burden", explanation: "Đáp án: cognitive burden. Cuối đoạn E có ghi: 'delegate decisions to others simply to avoid the cognitive burden involved'." },
                { type: "fill", id: 335, question: "10. (Điền tối đa 3 từ vào chỗ trống số 10)", correctAnswer: "navigate and compare", explanation: "Đáp án: navigate and compare. Thông tin nằm ở đoạn F: 'curate selections that are easier to navigate and compare'." },

		{ type: "title", text: "PART FOUR: WRITING (25 POINTS)" },
                
                // --- PHẦN VIẾT LẠI CÂU (BẮT ĐẦU BẰNG TỪ CHO SẴN) ---
                { type: "info", text: "<strong>I. For each of the following questions, complete the second sentence so that it has the same meaning as the given one, beginning with the word(s) provided. (8 pts.)</strong>" },
                { type: "fill", id: 401, question: "1. When he returned, there was a letter waiting for him.\n→ On his ________________________________", correctAnswer: "return, there was a letter waiting for him", explanation: "Đáp án: return, there was a letter waiting for him. Cấu trúc 'On + tính từ sở hữu + Noun' dùng để thay thế cho mệnh đề trạng ngữ chỉ thời gian." },
                { type: "fill", id: 402, question: "2. You should try harder in your construction project.\n→ You should put ________________________________", correctAnswer: "more effort into your construction project", explanation: "Đáp án: more effort into your construction project. Collocation 'put effort into something' (đầu tư công sức/nỗ lực vào việc gì)." },
                { type: "fill", id: 403, question: "3. They are employing drastic measures to prevent violent crime.\n→ With a view ________________________________", correctAnswer: "to preventing violent crime, they are employing drastic measures", explanation: "Đáp án: to preventing violent crime, they are employing drastic measures. Cấu trúc 'With a view to + V-ing' (với mục đích làm gì)." },
                { type: "fill", id: 404, question: "4. There is no chance that he will win against such an experienced player.\n→ He doesn't stand ________________________________", correctAnswer: "a chance of winning against such an experienced player", explanation: "Đáp án: a chance of winning against such an experienced player. Idiom 'stand a chance of doing sth' (có cơ hội làm gì)." },
                { type: "fill", id: 405, question: "5. We haven't decided what action to take to minimize pollution from cars.\n→ We have yet ________________________________", correctAnswer: "to decide what action to take to minimize pollution from cars", explanation: "Đáp án: to decide what action to take to minimize pollution from cars. Cấu trúc 'have yet to do sth' = 'haven't done sth' (vẫn chưa làm gì)." },
                { type: "fill", id: 406, question: "6. He tried his best but he couldn't get the incident out of his mind.\n→ Try ________________________________", correctAnswer: "as he might, he couldn't get the incident out of his mind", explanation: "Đáp án: as he might, he couldn't get the incident out of his mind. Cấu trúc đảo ngữ nhượng bộ: 'Try as + S + might/may, S + V' (Dù cố gắng đến đâu...)." },
                { type: "fill", id: 407, question: "7. You shouldn't approach the man, in any circumstances.\n→ Under ________________________________", correctAnswer: "no circumstances should you approach the man", explanation: "Đáp án: no circumstances should you approach the man. Đảo ngữ với 'Under no circumstances' (Trong bất kỳ hoàn cảnh nào cũng không)." },
                { type: "fill", id: 408, question: "8. Perhaps the search for the missing men was conducted in poor weather conditions.\n→ The search for the missing men ________________________________", correctAnswer: "might have been conducted in poor weather conditions", explanation: "Đáp án: might have been conducted in poor weather conditions (hoặc may have been). Cấu trúc 'might/may + have + Vp2' suy đoán một khả năng trong quá khứ." },

                // --- PHẦN VIẾT LẠI CÂU (DÙNG TỪ CHO SẴN) ---
                { type: "info", text: "<strong>II. For each of the following questions, complete the second sentence so that it has the same meaning as the given one, using the word in capital. Do not change the given word in any way. Use NO MORE THAN SEVEN WORDS. (7 pts.)</strong>" },
                { type: "fill", id: 409, question: "1. The fee they are offering has nothing to do with the amount of work involved. (RELATION)\n→ The fee ________________________________ the amount of work involved.", correctAnswer: "bears no relation to", explanation: "Đáp án: bears no relation to. Cụm từ 'bear no relation to' = 'have nothing to do with' (không liên quan gì đến)." },
                { type: "fill", id: 410, question: "2. The company had huge debts and was about to collapse. (BRINK)\n→ The company had huge debts and ________________________________.", correctAnswer: "was on the brink of collapse", explanation: "Đáp án: was on the brink of collapse. Idiom 'on the brink of' (trên bờ vực của)." },
                { type: "fill", id: 411, question: "3. Her lawyers have advised her not to say anything to the newspapers. (AGAINST)\n→ Her lawyers ________________________________ anything to the newspapers.", correctAnswer: "have advised her against saying", explanation: "Đáp án: have advised her against saying. Cấu trúc 'advise sb against doing sth' (khuyên ai không nên làm gì)." },
                { type: "fill", id: 412, question: "4. The hotel offers free breakfast and evening cocktails. (HOUSE)\n→ The hotel offers ________________________________", correctAnswer: "breakfast and evening cocktails on the house.", explanation: "Đáp án: breakfast and evening cocktails on the house. Idiom 'on the house' có nghĩa là miễn phí (được nhà hàng/khách sạn mời)." },
                { type: "fill", id: 413, question: "5. The school would have faced closure but for money from local businesses. (SAVED)\n→ Money ________________________________ closure.", correctAnswer: "from local businesses saved the school from", explanation: "Đáp án: from local businesses saved the school from. Cấu trúc 'save sb/sth from sth' (cứu ai/cái gì khỏi điều gì)." },
                { type: "fill", id: 414, question: "6. Because there remain several questions still to be answered, a meeting has been scheduled for next Monday. (REMAINING)\n→ There ________________________________ a meeting has been scheduled for next Monday.", correctAnswer: "remaining several questions still to be answered,", explanation: "Đáp án: remaining several questions still to be answered. Cấu trúc mệnh đề độc lập (absolute phrase) rút gọn với V-ing khi chủ ngữ là 'There'." },
                { type: "fill", id: 415, question: "7. I was the one before the last competitor in the race. (SECOND)\n→ I came ________________________________ in the race.", correctAnswer: "second to last", explanation: "Đáp án: second to last. Cụm từ 'second to last' có nghĩa là áp chót, đứng thứ hai từ dưới lên." },

            id: "exam_phanboichau_2025_2026",
            title: "🌊 Đề Chuyên Anh Phan Bội Châu 2025-2026",
            data: [
                // ================= SECTION B: LEXICO-GRAMMAR =================
                { type: "title", text: "SECTION B: LEXICO-GRAMMAR - Part 1" },
                { type: "info", text: "<strong>Choose the word or phrase that best completes each sentence.</strong>" },
                { type: "mcq", id: 1, question: "1. Vietnamese singer Hoa Minzy’s latest music video, Bac Bling, has taken the internet by ______, captivating audiences with its perfect fusion of traditional Vietnamese culture and modern music production.", options: { A: "wind", B: "storm", C: "breeze", D: "tornado" }, correctAnswer: "B", explanation: "Đáp án B. Thành ngữ 'take something by storm' = gây bão, thu hút mạnh mẽ, nhanh chóng." },
                { type: "mcq", id: 2, question: "2. While teachers at the school are not particularly strict, they are never ______ with students who skip classes or cheat on tests.", options: { A: "formal", B: "disciplined", C: "lenient", D: "adverse" }, correctAnswer: "C", explanation: "Đáp án C. 'be lenient with sb' = khoan dung, dễ dãi với ai. Nghĩa: giáo viên không quá nghiêm khắc nhưng không bao giờ dễ dãi với học sinh trốn học/gian lận." },
                { type: "mcq", id: 3, question: "3. Marine reptiles are among the few creatures that are known to have a possible life span greater than ______.", options: { A: "man", B: "that of man", C: "the man’s", D: "the one of man’s" }, correctAnswer: "B", explanation: "Đáp án B. So sánh hơn phải so sánh cùng loại: life span (của bò sát) với 'that of man' (that = the life span)." },
                { type: "mcq", id: 4, question: "4. People turned out in ______ to watch the parade on the 50th anniversary of Reunification Day in Vietnam.", options: { A: "volume", B: "mass", C: "force", D: "bulk" }, correctAnswer: "C", explanation: "Đáp án C. Cụm cố định 'turn out in force' = kéo đến với số lượng đông đảo." },
                { type: "mcq", id: 5, question: "5. ______, playing music is an effective way for them to open their heart to the outside world.", options: { A: "Being visually impaired people", B: "Such were their visual impairments", C: "Having been visually impaired", D: "For those with visual impairments" }, correctAnswer: "D", explanation: "Đáp án D. 'For those with visual impairments, ...' (Đối với những người khiếm thị, ...) – đại từ 'them' ở mệnh đề sau thay cho 'those'. Các phương án còn lại sai cấu trúc/không hợp nghĩa." },
                { type: "mcq", id: 6, question: "6. There are ______ words in English having more than one meaning. Pay close attention to this fact.", options: { A: "a large many", B: "quite many", C: "a great many", D: "quite a lot" }, correctAnswer: "C", explanation: "Đáp án C. 'a great many + N (số nhiều)' = rất nhiều. 'quite a lot' phải có 'of' mới đi với danh từ." },
                { type: "mcq", id: 7, question: "7. It's very important that we ______ as soon as there's any change in the patient's condition.", options: { A: "be notified", B: "being notified", C: "are notified", D: "were notified" }, correctAnswer: "A", explanation: "Đáp án A. Câu giả định: It's important that + S + (should) + V nguyên thể. Ở đây dạng bị động: be notified." },
                { type: "mcq", id: 8, question: "8. Choose the word CLOSEST in meaning to the underlined words:<br>Police officers <u>walk the beat</u> every night in order to make sure no one is committing a crime.", options: { A: "patrol", B: "appeal", C: "scrutinise", D: "investigate" }, correctAnswer: "A", explanation: "Đáp án A. 'walk the beat' = đi tuần tra khu vực được phân công ≈ patrol." },
                { type: "mcq", id: 9, question: "9. Choose the words that are OPPOSITE in meaning to the underlined words:<br>Always willing to talk to the media, and skilled in <u>putting his view across</u>, he reserved most of his energies for negotiations at the highest political levels.", options: { A: "communicating his view effectively", B: "disapproving his opinion", C: "explaining his ideas clearly", D: "conveying his view unclearly" }, correctAnswer: "D", explanation: "Đáp án D. 'put one's view across' = truyền đạt quan điểm một cách hiệu quả; trái nghĩa là truyền đạt không rõ ràng (conveying his view unclearly)." },
                { type: "mcq", id: 10, question: "10. Choose the option that best completes the following exchange.<br>Tom: “Judy is so excited about her trip to Hawaii.”<br>Mary: “______”", options: { A: "So do I.", B: "Sounds good to me.", C: "Who wouldn’t be?", D: "Don’t bother!" }, correctAnswer: "C", explanation: "Đáp án C. 'Who wouldn't be?' = Ai mà chẳng háo hức (đồng tình, hàm ý điều đó hiển nhiên)." },
 
                { type: "title", text: "Part 2 - Word Formation" },
                { type: "info", text: "<strong>Use the word given in capitals to form a word that fits in the space. Write your answers in the boxes provided.</strong>" },
                { type: "passage", text: `<h3>LAKES</h3>
<p>Lakes have always captured the imagination, and have inspired both artists and poets. A lake is a body of water (11)______ [CIRCLE] by land. The Greek word 'lakkos', meaning hole or pond, is the (12)______ [DERIVE] of the word. Lakes are (13)______ [IMMENSE] important for those living in the region, both (14)______ [AESTHETIC] and from a practical standpoint. Fresh-water lakes provide water for consumption and for irrigation. (15)______ [SIZE] lakes can affect local weather and are not (16)______ [SIGNIFY] as transport routes. Lakes are also important as (17)______ [RECREATION] areas, as their beauty and wealth of plant and animal life attract tourists and holidaymakers, who can enjoy a range of activities such as sailing or fishing.</p>
<p>Various factors can lead to the formation of lakes. When rivers deposit silt, their natural outlet to the sea may become closed, resulting in the (18)______ [ACCUMULATE] of water. In limestone areas, water can gather in collapsed sinkholes, forming lakes. The largest (19)______ [CONCENTRATE] of lakes is in northern latitudes where glacial action has been at work. Artificial lakes created by dam construction are known as 'reservoirs'. Apart from providing water for everyday (20)______ [CONSUME] and for irrigation, they also produce hydro-electric power.</p>` },
                { type: "fill", id: 11, question: "11. (CIRCLE) A lake is a body of water ______ by land.", correctAnswer: "encircled", explanation: "Đáp án: encircled (bị bao quanh). Rút gọn mệnh đề quan hệ bị động: a body of water (which is) encircled by land." },
                { type: "fill", id: 12, question: "12. (DERIVE) ...is the ______ of the word.", correctAnswer: "derivation", explanation: "Đáp án: derivation (nguồn gốc). Cần danh từ sau mạo từ 'the'." },
                { type: "fill", id: 13, question: "13. (IMMENSE) Lakes are ______ important for those living in the region...", correctAnswer: "immensely", explanation: "Đáp án: immensely. Cần trạng từ bổ nghĩa cho tính từ 'important'." },
                { type: "fill", id: 14, question: "14. (AESTHETIC) ...both ______ and from a practical standpoint.", correctAnswer: "aesthetically", explanation: "Đáp án: aesthetically. Cần trạng từ song song với cụm 'from a practical standpoint'." },
                { type: "fill", id: 15, question: "15. (SIZE) ______ lakes can affect local weather...", correctAnswer: "sizeable", explanation: "Đáp án: sizeable (cũng có thể viết 'sizable') = khá lớn. Cần tính từ đứng trước danh từ 'lakes'." },
                { type: "fill", id: 16, question: "16. (SIGNIFY) ...and are not ______ as transport routes.", correctAnswer: "insignificant", explanation: "Đáp án: insignificant. 'are not insignificant' = không phải không quan trọng (vẫn quan trọng) – phù hợp ngữ cảnh." },
                { type: "fill", id: 17, question: "17. (RECREATION) Lakes are also important as ______ areas...", correctAnswer: "recreational", explanation: "Đáp án: recreational. Cần tính từ bổ nghĩa cho 'areas' (khu vực giải trí)." },
                { type: "fill", id: 18, question: "18. (ACCUMULATE) ...resulting in the ______ of water.", correctAnswer: "accumulation", explanation: "Đáp án: accumulation (sự tích tụ). Cần danh từ sau 'the'." },
                { type: "fill", id: 19, question: "19. (CONCENTRATE) The largest ______ of lakes is in northern latitudes...", correctAnswer: "concentration", explanation: "Đáp án: concentration (mật độ/sự tập trung). Cần danh từ làm chủ ngữ." },
                { type: "fill", id: 20, question: "20. (CONSUME) ...providing water for everyday ______ and for irrigation...", correctAnswer: "consumption", explanation: "Đáp án: consumption (sự tiêu dùng). Cần danh từ sau tính từ 'everyday'." },
 
                { type: "title", text: "Part 3 - Error Identification" },
                { type: "info", text: "<strong>The passage below contains 10 mistakes. Identify and correct the mistakes.</strong> Bên dưới là từ bị lỗi ở mỗi dòng, hãy sửa lại cho đúng." },
                { type: "passage", text: `<div style="font-family: 'Times New Roman', Times, serif; font-size: 1.15em; line-height: 1.8; padding: 25px; background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: inset 0 0 10px rgba(0,0,0,0.02); color: #000;">
<div style="text-align:center; font-weight:bold; margin-bottom:10px;">REWARDING CHILDREN</div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(1)</span><div>Cash rewards is a common form of motivation used by parents with high expectations</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(2)</span><div>to encourage their children work hard at exam time. Some youngsters receive payments of as</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(3)</span><div>many as £100 for each A grade they obtain. But should such 'bribes' be based on exam</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(4)</span><div>performances or should they, as many parents and teachers feel, be offered in recognition for</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(5)</span><div>a child's effort, regardless of results? The later approach would solve the problem of how</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(6)</span><div>parents reward children with different levels of ability; imagine, for example, a family with one</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(7)</span><div>child who is academic gifted and another who has learning difficulties. The dangers of result-</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(8)</span><div>related incentives for the second child are clear; with much hope of obtaining the higher grades,</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(9)</span><div>the withholding of promised financial rewards would only compound the child's feeling of</div></div>
<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(10)</span><div>failure. Therefore, some leading educational psychologists believe that parents should rely on</div></div>

<div style="display: flex;"><span style="width: 40px; flex-shrink: 0; color: #555; font-weight: bold;">(12)</span><div>their child, then they should not condemn for operating a system of cash pay-outs.</div></div>
</div>` },
                { type: "fill", id: 21, question: "21. Line 1 (Lỗi: is) &rarr; Sửa thành:", correctAnswer: "are", explanation: "Đáp án: are. Chủ ngữ 'Cash rewards' là số nhiều nên động từ phải là 'are'." },
                { type: "fill", id: 22, question: "22. Line 2 (Lỗi: work) &rarr; Sửa thành:", correctAnswer: "to work", explanation: "Đáp án: to work. Cấu trúc: encourage sb + to V." },
                { type: "fill", id: 23, question: "23. Line 3 (Lỗi: many, trong 'as many as £100') &rarr; Sửa thành:", correctAnswer: "much", explanation: "Đáp án: much. 'as much as + số tiền' (tiền là lượng không đếm được theo cách diễn đạt này), không dùng 'as many as'." },
                { type: "fill", id: 24, question: "24. Line 4 (Lỗi: for, trong 'in recognition for') &rarr; Sửa thành:", correctAnswer: "of", explanation: "Đáp án: of. Cụm cố định: 'in recognition of' = để ghi nhận." },
                { type: "fill", id: 25, question: "25. Line 5 (Lỗi: later) &rarr; Sửa thành:", correctAnswer: "latter", explanation: "Đáp án: latter. 'the latter approach' = cách tiếp cận thứ hai (vừa nhắc sau). 'later' chỉ thời gian." },
                { type: "fill", id: 26, question: "26. Line 7 (Lỗi: academic) &rarr; Sửa thành:", correctAnswer: "academically", explanation: "Đáp án: academically. Cần trạng từ bổ nghĩa cho tính từ 'gifted'." },
                { type: "fill", id: 27, question: "27. Line 8 (Lỗi: much) &rarr; Sửa thành:", correctAnswer: "little", explanation: "Đáp án: little. 'with little hope of obtaining the higher grades' – đứa trẻ có khó khăn học tập ít hy vọng đạt điểm cao; 'much hope' mâu thuẫn với ý 'feeling of failure'." },
                { type: "fill", id: 28, question: "28. Line 10 (Lỗi: Therefore) &rarr; Sửa thành:", correctAnswer: "however", explanation: "Đáp án: However. Quan điểm của các nhà tâm lý học đối lập (không phải hệ quả) với ý ngay trước đó nên cần từ nối chỉ sự tương phản." },
                { type: "fill", id: 29, question: "29. Line 11 (Lỗi: his) &rarr; Sửa thành:", correctAnswer: "their", explanation: "Đáp án: their. Chủ ngữ 'parents' là số nhiều nên dùng 'their own judgement'." },
                { type: "fill", id: 30, question: "30. Line 12 (Lỗi: condemn) &rarr; Sửa thành:", correctAnswer: "be condemned", explanation: "Đáp án: be condemned. Cấu trúc bị động sau 'should not': parents (bị) chỉ trích vì vận hành hệ thống thưởng tiền." },
